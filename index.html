: ["Segregación de funciones en pagos", "Código de vestimenta", "Encuesta de clima", "Plan de marketing"], "correcta": 0, "fuente": "ISO 37001", "competencia": "Controles antisoborno", "remedial": "Estudiar Módulo 12, tema 1"}, {"id": "m12q2", "tipo": "vf", "nivel": "Intermedio", "texto": "Los controles no financieros incluyen cláusulas antisoborno en contratos.", "opciones": ["Verdadero", "Falso"], "correcta": 0, "fuente": "ISO 37001", "competencia": "Controles antisoborno", "remedial": "Estudiar Módulo 12, tema 2"}, {"id": "m12q3", "tipo": "mc", "nivel": "Básico", "texto": "Segregar funciones sirve para:", "opciones": ["Que nadie controle todo un proceso", "Reducir personal", "Ahorrar tiempo", "Eliminar registros"], "correcta": 0, "fuente": "ISO 37001:2025 (por verificar)", "competencia": "Controles antisoborno", "remedial": "Estudiar Módulo 12, tema 1"}, {"id": "m12q4", "tipo": "vf", "nivel": "Avanzado", "texto": "Al cambiar el negocio basta con mantener los controles anteriores.", "opciones": ["Verdadero", "Falso"], "correcta": 1, "fuente": "ISO 37001:2025 (por verificar)", "competencia": "Controles antisoborno", "remedial": "Estudiar Módulo 12, tema 3"}, {"id": "m12q5", "tipo": "mc", "nivel": "Profesional", "texto": "Entras a un mercado nuevo. Primero:", "opciones": ["Actualizas la evaluación de riesgos", "Reduces controles", "Esperas incidentes", "Cierras la oficina"], "correcta": 0, "fuente": "ISO 37001:2025 (por verificar)", "competencia": "Controles antisoborno", "remedial": "Estudiar Módulo 12, tema 3"}, {"id": "m12q6", "tipo": "mc", "nivel": "Profesional", "texto": "¿Cuál es un control no financiero?", "opciones": ["Evaluación de ofertas por comité", "Conciliación bancaria", "Doble firma de cheque", "Límite de pago"], "correcta": 0, "fuente": "ISO 37001:2025 (por verificar)", "competencia": "Controles antisoborno", "remedial": "Estudiar Módulo 12, tema 2"}], "intro": "Un control no es una intención: es algo que se hace, se evidencia y se revisa. También se actualiza cuando la organización cambia.", "objetivos": ["Distinguir controles financieros y no financieros.", "Diseñar controles proporcionales.", "Planificar cambios en el sistema y sus controles."], "competencias": ["Controles antisoborno"], "casos": [{"titulo": "Caso: Retail Andino", "texto": "Una cadena ficticia compra un competidor con prácticas desconocidas. Planifica qué debe revisar del sistema antes de integrarlo."}], "ejercicios": [{"titulo": "Ejercicio", "texto": "Indica tres elementos que deben actualizarse al entrar a un país nuevo.", "orientacion": "Evaluación de riesgos, controles de pago y capacitación local."}], "actividad": "Define un procedimiento de una página para evaluar cambios relevantes y su impacto en riesgos y controles.", "resumen": "Los controles financieros y no financieros se diseñan según el riesgo. Los cambios del negocio exigen planificar actualizaciones del sistema.", "glosario": [["Control financiero", "Gestiona transacciones para reducir el riesgo."], ["Control no financiero", "Cubre contratación, compras y relaciones."], ["Planificación de cambios", "Previsión de efectos y recursos ante modificaciones."], ["Segregación de funciones", "Separar quien aprueba de quien ejecuta."]], "bibliografia": ["ISO 37001:2025. Sistemas de gestión antisoborno. Requisitos con orientación para su uso.", "ISO 37301:2021. Sistemas de gestión de compliance. Requisitos con orientación.", "ISO/TS 37008 (edición vigente, por verificar). Investigaciones internas en organizaciones.", "ISO 31000:2018. Gestión del riesgo. Directrices.", "ISO 19011:2018. Directrices para la auditoría de los sistemas de gestión."]}, {"id": "m13", "titulo": "Módulo 13. Regalos, hospitalidad, donaciones y conflictos de intereses", "temas": [{"id": "m13t1", "titulo": "Regalos, hospitalidad y donaciones", "tags": [["t37001", "ISO 37001:2025"], ["tprop", "METODOLOGÍA ACADEMIA SGI"]], "tipo": "Requisito / Metodología", "trazabilidad": "ISO 37001 pide controlar estos riesgos; los umbrales son decisión de la organización según la ley aplicable. Numerales y cambios de la edición 2025 por verificar contra el texto oficial. Contenido original de Academia SGI; no constituye asesoría legal.", "texto": "Se define qué es aceptable según criterios como transparencia, proporcionalidad, momento (no durante licitaciones), destinatario y legalidad local. Se exige registro y aprobación previa sobre un umbral definido. Las donaciones y patrocinios se evalúan por beneficiario, finalidad y vínculos con decisiones pendientes."}, {"id": "m13t2", "titulo": "Conflictos de intereses", "tags": [["t37001", "ISO 37001:2025"], ["tcomp", "COMPLEMENTARIO"]], "tipo": "Requisito / Buena práctica", "trazabilidad": "Fuente: ISO 37001; el formato de declaración es buena práctica. Numerales y cambios de la edición 2025 por verificar contra el texto oficial. Contenido original de Academia SGI; no constituye asesoría legal.", "texto": "Existe conflicto cuando un interés personal puede influir, o parecer influir, en una decisión. Se gestiona con declaración periódica, abstención y reasignación. Ejemplo (educación): un comité de compras donde un miembro tiene un familiar entre los oferentes."}, {"id": "m13t3", "titulo": "Gestión del conflicto de intereses", "tags": [["t37001", "ISO 37001:2025"], ["tprop", "METODOLOGÍA ACADEMIA SGI"]], "tipo": "Requisito (edición) / Metodología", "trazabilidad": "Fuentes secundarias (organismos de certificación y firmas legales) sobre la edición 2025; contrastar con el texto oficial de ISO. La edición 2025 detalla más los conflictos de intereses según estas fuentes. Los pasos son metodología propia. Numerales por verificar contra el texto oficial. Contenido original de Academia SGI.", "texto": "Pasos: identificar situaciones posibles; declarar por escrito y periódicamente; evaluar el riesgo; decidir medidas (abstención, reasignación, supervisión); registrar y revisar.\n\nEjemplo (educación): un docente evalúa una propuesta presentada por su cónyuge; debe declararlo y retirarse de la decisión."}], "preguntas": [{"id": "m13q1", "tipo": "mc", "nivel": "Intermedio", "texto": "Los umbrales de regalos los define:", "opciones": ["ISO 37001 con un monto único", "La organización, considerando la ley y su riesgo", "El proveedor", "Nadie"], "correcta": 1, "fuente": "ISO 37001", "competencia": "Regalos y hospitalidad", "remedial": "Estudiar Módulo 13, tema 1"}, {"id": "m13q2", "tipo": "vf", "nivel": "Intermedio", "texto": "Un conflicto de intereses puede existir aunque no haya habido pago alguno.", "opciones": ["Verdadero", "Falso"], "correcta": 0, "fuente": "ISO 37001", "competencia": "Conflictos de intereses", "remedial": "Estudiar Módulo 13, tema 2"}, {"id": "m13q3", "tipo": "mc", "nivel": "Básico", "texto": "Un conflicto de intereses se gestiona con:", "opciones": ["Declaración y medidas", "Silencio", "Premios", "Auditoría externa"], "correcta": 0, "fuente": "ISO 37001:2025 (por verificar)", "competencia": "Conflictos de intereses", "remedial": "Estudiar Módulo 13, tema 2"}, {"id": "m13q4", "tipo": "vf", "nivel": "Avanzado", "texto": "Si nadie pagó, no hay conflicto.", "opciones": ["Verdadero", "Falso"], "correcta": 1, "fuente": "ISO 37001:2025 (por verificar)", "competencia": "Conflictos de intereses", "remedial": "Estudiar Módulo 13, tema 2"}, {"id": "m13q5", "tipo": "mc", "nivel": "Profesional", "texto": "Un miembro del comité tiene un familiar oferente. ¿Qué haces?", "opciones": ["Declararlo y abstenerse", "Votar igual", "Ocultarlo", "Renunciar al comité sin informar"], "correcta": 0, "fuente": "ISO 37001:2025 (por verificar)", "competencia": "Conflictos de intereses", "remedial": "Estudiar Módulo 13, tema 3"}, {"id": "m13q6", "tipo": "mc", "nivel": "Profesional", "texto": "Los umbrales de regalos deben:", "opciones": ["Fijarse según la ley y el riesgo de la organización", "Ser iguales en todo el mundo", "No existir", "Fijarlos el proveedor"], "correcta": 0, "fuente": "ISO 37001:2025 (por verificar)", "competencia": "Regalos y hospitalidad", "remedial": "Estudiar Módulo 13, tema 1"}], "intro": "Los regalos y los conflictos de intereses son terreno gris: por eso necesitan reglas simples, registro y transparencia.", "objetivos": ["Definir criterios para regalos y hospitalidad.", "Gestionar conflictos de intereses con pasos claros.", "Aplicar umbrales según la ley."], "competencias": ["Regalos y hospitalidad"], "casos": [{"titulo": "Caso: Universidad del Centro", "texto": "Un comité ficticio recibe una oferta de una empresa de un miembro. Define qué debe declararse y cómo gestionar la decisión."}], "ejercicios": [{"titulo": "Ejercicio", "texto": "Lista tres medidas para gestionar un conflicto declarado.", "orientacion": "Abstención, reasignación y supervisión adicional."}], "actividad": "Diseña un formulario de declaración de conflictos con cinco campos y pruébalo con dos personas.", "resumen": "Regalos y hospitalidad se evalúan por transparencia, proporcionalidad y legalidad. Los conflictos se declaran, evalúan y gestionan con registro.", "glosario": [["Regalo", "Obsequio con valor para el receptor."], ["Hospitalidad", "Atenciones como comidas o viajes."], ["Conflicto de intereses", "Interés personal que puede influir en una decisión."], ["Abstención", "No participar en una decisión por conflicto."]], "bibliografia": ["ISO 37001:2025. Sistemas de gestión antisoborno. Requisitos con orientación para su uso.", "ISO 37301:2021. Sistemas de gestión de compliance. Requisitos con orientación.", "ISO/TS 37008 (edición vigente, por verificar). Investigaciones internas en organizaciones.", "ISO 31000:2018. Gestión del riesgo. Directrices.", "ISO 19011:2018. Directrices para la auditoría de los sistemas de gestión."]}, {"id": "m14", "titulo": "Módulo 14. Denuncias, investigaciones e incidentes de soborno", "temas": [{"id": "m14t1", "titulo": "Canal de denuncias", "tags": [["t37001", "ISO 37001:2025"]], "tipo": "Requisito", "trazabilidad": "Fuente: ISO 37001 (planteamiento de inquietudes). Numerales y cambios de la edición 2025 por verificar contra el texto oficial. Contenido original de Academia SGI; no constituye asesoría legal.", "texto": "La organización facilita que se comuniquen sospechas de buena fe, con confidencialidad y sin represalias, y permite el anonimato cuando la ley lo admite. Se informa a las personas cómo usar el canal."}, {"id": "m14t2", "titulo": "Investigación y respuesta", "tags": [["t37001", "ISO 37001:2025"], ["tprop", "METODOLOGÍA ACADEMIA SGI"]], "tipo": "Requisito / Metodología", "trazabilidad": "ISO 37001 (evaluar e investigar); el protocolo es metodología propia. Numerales y cambios de la edición 2025 por verificar contra el texto oficial. Contenido original de Academia SGI; no constituye asesoría legal.", "texto": "Pasos: recibir y registrar, evaluar la verosimilitud, proteger evidencias, asignar investigadores independientes, consultar asesoría legal, decidir medidas y cerrar con lecciones aprendidas. No se investiga con personas involucradas en los hechos.\n\nSe conecta con contingencias (Módulo 19)."}, {"id": "m14t3", "titulo": "Investigaciones internas", "tags": [["t37001", "ISO 37001:2025"], ["tiso", "ISO/TS 37008 (complementaria)"], ["tcomp", "COMPLEMENTARIO"]], "tipo": "Requisito / Guía complementaria", "trazabilidad": "ISO 37001 exige evaluar e investigar; ISO/TS 37008 es una especificación técnica complementaria sobre investigaciones internas (por verificar). Numerales por verificar contra el texto oficial. Contenido original de Academia SGI.", "texto": "Principios: independencia de los investigadores, confidencialidad, proporcionalidad, respeto a los derechos de las personas, documentación y asesoría legal. No se investiga con quienes están involucrados.\n\nSe conserva la evidencia y se cierra con conclusiones y acciones. Ejemplo (servicios financieros): un analista denuncia pagos irregulares; un equipo independiente revisa registros antes de entrevistar."}], "preguntas": [{"id": "m14q1", "tipo": "mc", "nivel": "Intermedio", "texto": "Ante una denuncia, lo primero es:", "opciones": ["Avisar al denunciado", "Registrar, proteger evidencias y evaluar con independencia", "Descartarla", "Publicarla"], "correcta": 1, "fuente": "ISO 37001", "competencia": "Gestión de denuncias", "remedial": "Estudiar Módulo 14, tema 2"}, {"id": "m14q2", "tipo": "vf", "nivel": "Intermedio", "texto": "Quien denuncia de buena fe debe estar protegido de represalias.", "opciones": ["Verdadero", "Falso"], "correcta": 0, "fuente": "ISO 37001", "competencia": "Gestión de denuncias", "remedial": "Estudiar Módulo 14, tema 1"}, {"id": "m14q3", "tipo": "mc", "nivel": "Básico", "texto": "Una denuncia debe tratarse con:", "opciones": ["Confidencialidad y sin represalias", "Publicidad", "Burla", "Silencio total"], "correcta": 0, "fuente": "ISO 37001:2025 (por verificar)", "competencia": "Gestión de denuncias", "remedial": "Estudiar Módulo 14, tema 1"}, {"id": "m14q4", "tipo": "vf", "nivel": "Avanzado", "texto": "Quien investiga puede ser un implicado.", "opciones": ["Verdadero", "Falso"], "correcta": 1, "fuente": "ISO 37001:2025 (por verificar)", "competencia": "Gestión de denuncias", "remedial": "Estudiar Módulo 14, tema 3"}, {"id": "m14q5", "tipo": "mc", "nivel": "Profesional", "texto": "Se denuncia a un directivo. ¿Quién investiga?", "opciones": ["Un equipo independiente", "Su jefe directo", "El denunciado", "Un proveedor"], "correcta": 0, "fuente": "ISO 37001:2025 (por verificar)", "competencia": "Gestión de denuncias", "remedial": "Estudiar Módulo 14, tema 3"}, {"id": "m14q6", "tipo": "mc", "nivel": "Profesional", "texto": "¿Qué protege la evidencia?", "opciones": ["Cadena de custodia", "Borrar archivos", "Mover documentos", "Firmar un acta de cierre"], "correcta": 0, "fuente": "ISO 37001:2025 (por verificar)", "competencia": "Gestión de denuncias", "remedial": "Estudiar Módulo 14, tema 3"}], "intro": "Una denuncia mal manejada daña a todos. Aquí se aprende a recibirla, protegerla y investigarla con independencia.", "objetivos": ["Diseñar un canal con confidencialidad y no represalias.", "Seguir un protocolo de investigación.", "Usar guías complementarias sobre investigaciones."], "competencias": ["Gestión de denuncias"], "casos": [{"titulo": "Caso: Aseguradora Faro", "texto": "Una denuncia ficticia señala a un directivo. El comité propone que su superior directo investigue. Evalúa el riesgo y propón una alternativa."}], "ejercicios": [{"titulo": "Ejercicio", "texto": "Indica tres principios de una investigación interna.", "orientacion": "Independencia, confidencialidad y documentación."}], "actividad": "Redacta el flujo de tu canal de denuncias: recepción, evaluación, investigación, decisión y cierre.", "resumen": "Las denuncias se reciben con confidencialidad y sin represalias. Las investigaciones son independientes, proporcionales y documentadas.", "glosario": [["Denuncia", "Comunicación de una sospecha de buena fe."], ["Represalia", "Trato adverso contra quien denuncia."], ["Investigación interna", "Proceso para esclarecer hechos."], ["Cadena de custodia", "Registro que protege la integridad de la evidencia."]], "bibliografia": ["ISO 37001:2025. Sistemas de gestión antisoborno. Requisitos con orientación para su uso.", "ISO 37301:2021. Sistemas de gestión de compliance. Requisitos con orientación.", "ISO/TS 37008 (edición vigente, por verificar). Investigaciones internas en organizaciones.", "ISO 31000:2018. Gestión del riesgo. Directrices.", "ISO 19011:2018. Directrices para la auditoría de los sistemas de gestión."]}, {"id": "m15", "titulo": "Módulo 15. Seguimiento, medición, auditoría y mejora del sistema antisoborno", "temas": [{"id": "m15t1", "titulo": "Seguimiento y auditoría interna", "tags": [["t37001", "ISO 37001:2025"], ["t19011", "ISO 19011:2018"]], "tipo": "Requisito / Directriz", "trazabilidad": "ISO 37001 exige auditorías internas; ISO 19011:2018 ofrece directrices (no requisitos). Numerales y cambios de la edición 2025 por verificar contra el texto oficial. Contenido original de Academia SGI; no constituye asesoría legal.", "texto": "Se miden indicadores (capacitación completada, denuncias recibidas y cerradas, excepciones aprobadas, terceros con debida diligencia vigente). La auditoría interna verifica conformidad y eficacia. ISO 19011 orienta programa, criterios, muestreo y competencia de auditores."}, {"id": "m15t2", "titulo": "Revisión y mejora continua", "tags": [["t37001", "ISO 37001:2025"], ["t9001", "ISO 9001:2015"]], "tipo": "Requisito", "trazabilidad": "Fuente: ISO 37001; ISO 9001:2015 comparte el enfoque de revisión y mejora. Numerales y cambios de la edición 2025 por verificar contra el texto oficial. Contenido original de Academia SGI; no constituye asesoría legal.", "texto": "La alta dirección y el órgano de gobierno revisan resultados periódicamente. Las no conformidades se corrigen, se analizan sus causas y se verifica la eficacia de las acciones. La mejora es continua, no un proyecto con fecha de fin."}, {"id": "m15t3", "titulo": "La transición 2016 a 2025 como proyecto", "tags": [["t37001", "ISO 37001:2025"], ["tint", "INTEGRADO"], ["tprop", "METODOLOGÍA ACADEMIA SGI"]], "tipo": "Buena práctica / Requisito", "trazabilidad": "Fuentes secundarias (organismos de certificación y firmas legales) sobre la edición 2025; contrastar con el texto oficial de ISO. Las fechas de transición se confirman con el organismo de certificación; una fuente secundaria menciona febrero de 2027 como límite para certificados de la edición 2016. Numerales por verificar contra el texto oficial. Contenido original de Academia SGI.", "texto": "Pasos: diagnóstico de brechas contra la edición 2025; plan de acción con responsables y fechas; actualización de documentos y controles; capacitación; auditoría interna; revisión por la dirección; coordinación con el organismo de certificación.\n\nUsa las herramientas de la plataforma: la matriz de integración para trazar requisitos y el generador de planes de acción para las brechas."}], "preguntas": [{"id": "m15q1", "tipo": "vf", "nivel": "Intermedio", "texto": "ISO 19011 establece requisitos certificables para el sistema antisoborno.", "opciones": ["Verdadero", "Falso"], "correcta": 1, "fuente": "ISO 19011:2018 (directrices)", "competencia": "Auditoría", "remedial": "Estudiar Módulo 15, tema 1"}, {"id": "m15q2", "tipo": "mc", "nivel": "Intermedio", "texto": "Tras una no conformidad se debe:", "opciones": ["Solo corregir el hecho", "Corregir, analizar causas y verificar la eficacia", "Esperar la próxima auditoría", "Ocultarla"], "correcta": 1, "fuente": "ISO 37001", "competencia": "Mejora continua", "remedial": "Estudiar Módulo 15, tema 2"}, {"id": "m15q3", "tipo": "mc", "nivel": "Básico", "texto": "¿Qué hace una auditoría interna?", "opciones": ["Verifica la conformidad y eficacia", "Sanciona", "Cierra el sistema", "Elimina riesgos"], "correcta": 0, "fuente": "ISO 37001:2025 (por verificar)", "competencia": "Auditoría", "remedial": "Estudiar Módulo 15, tema 1"}, {"id": "m15q4", "tipo": "vf", "nivel": "Avanzado", "texto": "Las fechas de transición se confirman con el organismo de certificación.", "opciones": ["Verdadero", "Falso"], "correcta": 0, "fuente": "ISO 37001:2025 (por verificar)", "competencia": "Auditoría", "remedial": "Estudiar Módulo 15, tema 3"}, {"id": "m15q5", "tipo": "mc", "nivel": "Profesional", "texto": "¿Por qué conviene gestionar la transición como proyecto?", "opciones": ["Para planificar brechas, responsables y plazos", "Para evitar auditorías", "Para cambiar la política", "Para despedir personal"], "correcta": 0, "fuente": "ISO 37001:2025 (por verificar)", "competencia": "Auditoría", "remedial": "Estudiar Módulo 15, tema 3"}, {"id": "m15q6", "tipo": "mc", "nivel": "Profesional", "texto": "ISO 19011 en esta auditoría es:", "opciones": ["Una directriz sobre cómo auditar", "Un requisito certificable", "Un sistema antisoborno", "Una política"], "correcta": 0, "fuente": "ISO 19011:2018", "competencia": "Auditoría", "remedial": "Estudiar Módulo 15, tema 1"}], "intro": "Medir sirve si lleva a decidir. Este módulo cierra el ciclo del sistema: seguimiento, auditoría, revisión y mejora, incluida la transición entre ediciones.", "objetivos": ["Definir indicadores útiles.", "Planificar auditorías con apoyo de ISO 19011.", "Gestionar la transición a la edición 2025."], "competencias": ["Auditoría"], "casos": [{"titulo": "Caso: Textiles del Sur", "texto": "Una empresa ficticia con certificado 2016 deja la transición para el último mes. Evalúa riesgos de esa decisión y propón un calendario."}], "ejercicios": [{"titulo": "Ejercicio", "texto": "Ordena: auditoría interna, diagnóstico, capacitación, plan de acción.", "orientacion": "Diagnóstico, plan de acción, capacitación, auditoría interna."}], "actividad": "Haz un diagnóstico de cinco brechas respecto a la edición 2025 y regístralas como planes de acción.", "resumen": "Se mide, audita y revisa para mejorar. La transición a la edición 2025 se gestiona como proyecto con diagnóstico, plan y verificación.", "glosario": [["Indicador", "Medida para seguir un resultado."], ["Auditoría interna", "Verificación periódica del sistema."], ["Revisión por la dirección", "Evaluación del sistema por la alta dirección."], ["Brecha", "Diferencia entre lo exigido y lo existente."]], "bibliografia": ["ISO 37001:2025. Sistemas de gestión antisoborno. Requisitos con orientación para su uso.", "ISO 37301:2021. Sistemas de gestión de compliance. Requisitos con orientación.", "ISO/TS 37008 (edición vigente, por verificar). Investigaciones internas en organizaciones.", "ISO 31000:2018. Gestión del riesgo. Directrices.", "ISO 19011:2018. Directrices para la auditoría de los sistemas de gestión."]}, {"id": "m16", "titulo": "Módulo 16. Fundamentos de ISO 9001:2015", "temas": [{"id": "m16t1", "titulo": "Enfoque a procesos, PDCA y pensamiento basado en riesgos", "tags": [["t9001", "ISO 9001:2015"]], "tipo": "Requisito", "trazabilidad": "Fuente: ISO 9001:2015 (requisitos certificables). Numerales y enmiendas por verificar contra el texto oficial vigente. Contenido original de Academia SGI.", "texto": "ISO 9001 especifica requisitos para un sistema de gestión de la calidad orientado a proporcionar productos y servicios conformes y aumentar la satisfacción del cliente. Se apoya en el enfoque a procesos, el ciclo Planificar-Hacer-Verificar-Actuar y el pensamiento basado en riesgos.\n\nEjemplo (industria): una planta de envases define el proceso de inyección con entradas, salidas, controles e indicadores de rechazo."}, {"id": "m16t2", "titulo": "Principios de la gestión de la calidad", "tags": [["t9001", "ISO 9001:2015"], ["tcomp", "COMPLEMENTARIO"]], "tipo": "Principio", "trazabilidad": "Los siete principios provienen de la familia ISO 9000 (por verificar edición). Numerales y enmiendas por verificar contra el texto oficial vigente. Contenido original de Academia SGI.", "texto": "Enfoque al cliente, liderazgo, compromiso de las personas, enfoque a procesos, mejora, toma de decisiones basada en la evidencia y gestión de las relaciones. Son principios que inspiran la norma; los requisitos certificables están en ISO 9001."}, {"id": "m16t3", "titulo": "Cambio climático y calidad (Enmienda 1:2024)", "tags": [["t9001", "ISO 9001:2015"], ["tcomp", "COMPLEMENTARIO"]], "tipo": "Requisito (enmienda)", "trazabilidad": "Fuentes secundarias indican que la Enmienda 1:2024 incorporó el cambio climático a las normas de sistemas de gestión, incluida ISO 9001. Contrastar con el texto oficial. Numerales y edición por verificar contra el texto oficial. Contenido original de Academia SGI.", "texto": "Al determinar el contexto y las partes interesadas, la organización considera si el cambio climático es pertinente para sus resultados. No obliga a tener un sistema ambiental: obliga a decidir y justificar.\n\nEjemplo (agroindustria): sequías más frecuentes afectan la calidad y regularidad de la materia prima; se registra como cuestión externa y se vincula a planes de proveedores."}], "preguntas": [{"id": "m16q1", "tipo": "mc", "nivel": "Intermedio", "texto": "¿Cuál NO es uno de los principios de gestión de la calidad?", "opciones": ["Enfoque al cliente", "Mejora", "Maximizar el apetito de riesgo", "Toma de decisiones basada en la evidencia"], "correcta": 2, "fuente": "ISO 9001:2015", "competencia": "Fundamentos de calidad", "remedial": "Estudiar Módulo 16, tema 2"}, {"id": "m16q2", "tipo": "vf", "nivel": "Intermedio", "texto": "ISO 9001 se basa en el enfoque a procesos y el ciclo PDCA.", "opciones": ["Verdadero", "Falso"], "correcta": 0, "fuente": "ISO 9001:2015", "competencia": "Fundamentos de calidad", "remedial": "Estudiar Módulo 16, tema 1"}, {"id": "m16q3", "tipo": "mc", "nivel": "Básico", "texto": "ISO 9001 tiene como centro:", "opciones": ["El enfoque a procesos y la satisfacción del cliente", "La contabilidad", "La seguridad informática", "La auditoría externa"], "correcta": 0, "fuente": "ISO 9001:2015", "competencia": "Fundamentos de calidad", "remedial": "Estudiar Módulo 16, tema 1"}, {"id": "m16q4", "tipo": "vf", "nivel": "Avanzado", "texto": "La enmienda sobre clima obliga a implementar un sistema ambiental.", "opciones": ["Verdadero", "Falso"], "correcta": 1, "fuente": "ISO 9001:2015", "competencia": "Fundamentos de calidad", "remedial": "Estudiar Módulo 16, tema 3"}, {"id": "m16q5", "tipo": "mc", "nivel": "Profesional", "texto": "Sequías afectan tu materia prima. ¿Cómo lo tratas?", "opciones": ["Como cuestión externa pertinente, vinculada a riesgos y proveedores", "Lo ignoras", "Cambias la política", "Cierras la planta"], "correcta": 0, "fuente": "ISO 9001:2015", "competencia": "Fundamentos de calidad", "remedial": "Estudiar Módulo 16, tema 3"}, {"id": "m16q6", "tipo": "mc", "nivel": "Profesional", "texto": "Decidir que el clima no es pertinente exige:", "opciones": ["Justificar la decisión", "Nada", "Certificarse en clima", "Eliminar objetivos"], "correcta": 0, "fuente": "ISO 9001:2015", "competencia": "Fundamentos de calidad", "remedial": "Estudiar Módulo 16, tema 3"}], "intro": "La calidad no es un departamento: es la capacidad de cumplir lo prometido, de forma constante. Aquí se asienta la lógica de ISO 9001 y su actualización reciente.", "objetivos": ["Describir el enfoque a procesos y el pensamiento basado en riesgos.", "Reconocer los principios de la gestión de la calidad.", "Identificar el cambio climático como cuestión a considerar."], "competencias": ["Fundamentos de calidad"], "casos": [{"titulo": "Caso: Frutas del Valle", "texto": "Una procesadora ficticia sufre variaciones de calidad por cambios climáticos en sus proveedores. Decide si es una cuestión pertinente y cómo reflejarla en riesgos y controles."}], "ejercicios": [{"titulo": "Ejercicio", "texto": "Indica una cuestión externa climática y un objetivo de calidad afectado.", "orientacion": "Ejemplo: sequías, afectan la regularidad de la materia prima y el objetivo de no conformidades."}], "actividad": "Revisa el análisis de contexto de tu organización y justifica si el cambio climático es pertinente o no.", "resumen": "ISO 9001 se basa en procesos, PDCA y riesgos. La Enmienda 1:2024 pide considerar si el cambio climático es pertinente. Se justifica, no se presume.", "glosario": [["Calidad", "Capacidad de cumplir requisitos y satisfacer al cliente."], ["Enmienda", "Cambio formal a una norma."], ["Cuestión pertinente", "Factor que afecta los resultados previstos."], ["Proveedor externo", "Quien suministra productos o servicios."]], "bibliografia": ["ISO 9001:2015. Sistemas de gestión de la calidad. Requisitos (y Enmienda 1:2024, por verificar).", "ISO 9000:2015. Sistemas de gestión de la calidad. Fundamentos y vocabulario.", "ISO 22301:2019. Seguridad y resiliencia. Sistemas de gestión de continuidad del negocio. Requisitos.", "ISO 31000:2018. Gestión del riesgo. Directrices.", "ISO 19011:2018. Directrices para la auditoría de los sistemas de gestión."]}, {"id": "m17", "titulo": "Módulo 17. Gestión por procesos, liderazgo y planificación", "temas": [{"id": "m17t1", "titulo": "Gestión por procesos", "tags": [["t9001", "ISO 9001:2015"], ["tprop", "METODOLOGÍA ACADEMIA SGI"]], "tipo": "Requisito / Metodología", "trazabilidad": "ISO 9001:2015 (enfoque a procesos); la ficha de proceso es metodología propia. Numerales y enmiendas por verificar contra el texto oficial vigente. Contenido original de Academia SGI.", "texto": "Un proceso transforma entradas en salidas con recursos, responsables, controles e indicadores. Se documenta su secuencia e interacción con otros procesos. Una ficha de proceso útil indica objetivo, alcance, proveedores, clientes, riesgos, controles e indicadores.\n\nEjemplo (comercio): el proceso de reposición conecta ventas, compras y almacén."}, {"id": "m17t2", "titulo": "Liderazgo y planificación", "tags": [["t9001", "ISO 9001:2015"], ["t31000", "ISO 31000:2018"]], "tipo": "Requisito / Directriz", "trazabilidad": "ISO 9001:2015 exige abordar riesgos y oportunidades; no exige un método formal de gestión de riesgos. ISO 31000 es una opción complementaria. Numerales y enmiendas por verificar contra el texto oficial vigente. Contenido original de Academia SGI.", "texto": "La alta dirección demuestra liderazgo con enfoque al cliente, política de calidad y recursos. En la planificación determina riesgos y oportunidades, establece objetivos medibles y planifica cómo lograrlos. La organización decide cuánta formalidad aplicar según su contexto."}, {"id": "m17t3", "titulo": "Objetivos e indicadores de calidad", "tags": [["t9001", "ISO 9001:2015"], ["tprop", "METODOLOGÍA ACADEMIA SGI"]], "tipo": "Requisito / Metodología", "trazabilidad": "ISO 9001:2015 exige objetivos de calidad medibles y coherentes con la política; la redacción SMART es buena práctica. Numerales y edición por verificar contra el texto oficial. Contenido original de Academia SGI.", "texto": "Un objetivo útil indica qué, cuánto y para cuándo, tiene responsable y recursos, y se vincula a un indicador con fórmula, fuente y frecuencia.\n\nEjemplo (servicios): «Responder el 95 % de los reclamos en 48 horas durante el semestre», medido en el sistema de atención y revisado cada mes."}], "preguntas": [{"id": "m17q1", "tipo": "vf", "nivel": "Intermedio", "texto": "ISO 9001 exige aplicar ISO 31000 para gestionar riesgos.", "opciones": ["Verdadero", "Falso"], "correcta": 1, "fuente": "ISO 9001:2015", "competencia": "Planificación de la calidad", "remedial": "Estudiar Módulo 17, tema 2"}, {"id": "m17q2", "tipo": "mc", "nivel": "Intermedio", "texto": "Una ficha de proceso debe incluir, entre otros:", "opciones": ["Objetivo, responsables, riesgos e indicadores", "Solo el nombre", "Solo el organigrama", "La lista de clientes"], "correcta": 0, "fuente": "Metodología Academia SGI", "competencia": "Gestión por procesos", "remedial": "Estudiar Módulo 17, tema 1"}, {"id": "m17q3", "tipo": "mc", "nivel": "Básico", "texto": "Un objetivo de calidad debe ser:", "opciones": ["Medible", "Secreto", "Genérico", "Anual siempre"], "correcta": 0, "fuente": "ISO 9001:2015", "competencia": "Planificación de la calidad", "remedial": "Estudiar Módulo 17, tema 3"}, {"id": "m17q4", "tipo": "vf", "nivel": "Avanzado", "texto": "«Mejorar el servicio» es un objetivo medible.", "opciones": ["Verdadero", "Falso"], "correcta": 1, "fuente": "ISO 9001:2015", "competencia": "Planificación de la calidad", "remedial": "Estudiar Módulo 17, tema 3"}, {"id": "m17q5", "tipo": "mc", "nivel": "Profesional", "texto": "¿Qué falta en «Reducir quejas»?", "opciones": ["Meta, plazo e indicador", "Nada", "Más quejas", "Auditoría"], "correcta": 0, "fuente": "ISO 9001:2015", "competencia": "Planificación de la calidad", "remedial": "Estudiar Módulo 17, tema 3"}, {"id": "m17q6", "tipo": "mc", "nivel": "Profesional", "texto": "El liderazgo se demuestra con:", "opciones": ["Enfoque al cliente, política y recursos", "Solo discursos", "Delegar todo", "Ninguno"], "correcta": 0, "fuente": "ISO 9001:2015", "competencia": "Gestión por procesos", "remedial": "Estudiar Módulo 17, tema 2"}], "intro": "Planificar es decidir qué se va a lograr y cómo se sabrá. Los objetivos sin indicador son deseos.", "objetivos": ["Describir procesos con ficha completa.", "Redactar objetivos de calidad medibles.", "Relacionar liderazgo con enfoque al cliente."], "competencias": ["Planificación de la calidad"], "casos": [{"titulo": "Caso: Clínica Esperanza", "texto": "Una clínica ficticia fija el objetivo «mejorar el servicio». Reescríbelo como objetivo medible y define el indicador."}], "ejercicios": [{"titulo": "Ejercicio", "texto": "Convierte «mejorar entregas» en un objetivo medible.", "orientacion": "Ejemplo: entregar a tiempo el 97 % de los pedidos durante el próximo trimestre."}], "actividad": "Redacta tres objetivos medibles de un proceso tuyo y define su indicador con fórmula y frecuencia.", "resumen": "Los objetivos de calidad son medibles, coherentes con la política y tienen responsable e indicador. Los procesos se describen con ficha completa.", "glosario": [["Objetivo medible", "Resultado con meta, plazo y forma de medición."], ["Indicador", "Medida que sigue el logro."], ["Política de calidad", "Orientación de la alta dirección sobre calidad."], ["Responsable", "Persona con autoridad sobre el resultado."]], "bibliografia": ["ISO 9001:2015. Sistemas de gestión de la calidad. Requisitos (y Enmienda 1:2024, por verificar).", "ISO 9000:2015. Sistemas de gestión de la calidad. Fundamentos y vocabulario.", "ISO 22301:2019. Seguridad y resiliencia. Sistemas de gestión de continuidad del negocio. Requisitos.", "ISO 31000:2018. Gestión del riesgo. Directrices.", "ISO 19011:2018. Directrices para la auditoría de los sistemas de gestión."]}, {"id": "m18", "titulo": "Módulo 18. Control operacional, evaluación del desempeño y satisfacción del cliente", "temas": [{"id": "m18t1", "titulo": "Control operacional", "tags": [["t9001", "ISO 9001:2015"]], "tipo": "Requisito", "trazabilidad": "Fuente: ISO 9001:2015 (operación). Numerales y enmiendas por verificar contra el texto oficial vigente. Contenido original de Academia SGI.", "texto": "Se planifican y controlan las actividades que producen el producto o servicio: criterios, recursos, control de proveedores externos, identificación y trazabilidad, y tratamiento de salidas no conformes para evitar que lleguen al cliente.\n\nEjemplo (servicios de salud): un protocolo de verificación de identidad del paciente antes de cada procedimiento."}, {"id": "m18t2", "titulo": "Evaluación del desempeño", "tags": [["t9001", "ISO 9001:2015"], ["t19011", "ISO 19011:2018"]], "tipo": "Requisito / Directriz", "trazabilidad": "ISO 9001:2015 exige seguimiento, auditoría interna y revisión por la dirección; ISO 19011 orienta cómo auditar (directriz). Numerales y enmiendas por verificar contra el texto oficial vigente. Contenido original de Academia SGI.", "texto": "Se hace seguimiento a la percepción del cliente, se analizan datos, se realizan auditorías internas y la dirección revisa el sistema. La satisfacción no se mide solo con encuestas: reclamos, devoluciones y recompra también informan."}, {"id": "m18t3", "titulo": "La voz del cliente", "tags": [["t9001", "ISO 9001:2015"], ["tprop", "METODOLOGÍA ACADEMIA SGI"]], "tipo": "Requisito / Metodología", "trazabilidad": "ISO 9001:2015 exige hacer seguimiento a la percepción del cliente; las fuentes concretas son decisión de la organización. Numerales y edición por verificar contra el texto oficial. Contenido original de Academia SGI.", "texto": "Fuentes: encuestas, reclamos, devoluciones, recompra, comentarios y reuniones con clientes. Se combinan porque cada una ve una parte.\n\nSe analizan por proceso y causa, se comunican a los responsables y se convierten en acciones. Ejemplo (comercio): las devoluciones por talla incorrecta llevan a cambiar la ficha de producto."}], "preguntas": [{"id": "m18q1", "tipo": "mc", "nivel": "Intermedio", "texto": "Las salidas no conformes deben:", "opciones": ["Entregarse igual", "Identificarse y controlarse para evitar su uso o entrega no prevista", "Ignorarse", "Archivarse sin registro"], "correcta": 1, "fuente": "ISO 9001:2015", "competencia": "Control operacional", "remedial": "Estudiar Módulo 18, tema 1"}, {"id": "m18q2", "tipo": "vf", "nivel": "Intermedio", "texto": "La satisfacción del cliente solo puede medirse con encuestas.", "opciones": ["Verdadero", "Falso"], "correcta": 1, "fuente": "ISO 9001:2015", "competencia": "Satisfacción del cliente", "remedial": "Estudiar Módulo 18, tema 2"}, {"id": "m18q3", "tipo": "mc", "nivel": "Básico", "texto": "¿Qué es una salida no conforme?", "opciones": ["Un producto o servicio que no cumple requisitos", "Una auditoría", "Un indicador", "Un proveedor"], "correcta": 0, "fuente": "ISO 9001:2015", "competencia": "Control operacional", "remedial": "Estudiar Módulo 18, tema 1"}, {"id": "m18q4", "tipo": "vf", "nivel": "Avanzado", "texto": "Una sola encuesta basta para conocer la satisfacción.", "opciones": ["Verdadero", "Falso"], "correcta": 1, "fuente": "ISO 9001:2015", "competencia": "Satisfacción del cliente", "remedial": "Estudiar Módulo 18, tema 3"}, {"id": "m18q5", "tipo": "mc", "nivel": "Profesional", "texto": "Satisfacción de 85 % en encuestas y devoluciones al alza. ¿Qué indica?", "opciones": ["Que la encuesta no capta todo: hay que triangular fuentes", "Que todo está bien", "Que el cliente miente", "Nada"], "correcta": 0, "fuente": "ISO 9001:2015", "competencia": "Satisfacción del cliente", "remedial": "Estudiar Módulo 18, tema 3"}, {"id": "m18q6", "tipo": "mc", "nivel": "Profesional", "texto": "¿Qué se hace con los datos de satisfacción?", "opciones": ["Analizarlos y convertirlos en acciones", "Archivarlos", "Ocultarlos", "Cambiar objetivos"], "correcta": 0, "fuente": "ISO 9001:2015", "competencia": "Satisfacción del cliente", "remedial": "Estudiar Módulo 18, tema 3"}], "intro": "Lo que no se mide ni se escucha no mejora. Este módulo conecta la operación con la voz del cliente y la verificación del sistema.", "objetivos": ["Aplicar controles operacionales.", "Medir la percepción del cliente con varias fuentes.", "Usar los resultados en auditoría y revisión."], "competencias": ["Control operacional"], "casos": [{"titulo": "Caso: Tienda Primavera", "texto": "Una tienda ficticia solo mide satisfacción con encuestas y recibe 85 %, pero crecen las devoluciones. Explica el sesgo y propón fuentes adicionales."}], "ejercicios": [{"titulo": "Ejercicio", "texto": "Lista tres fuentes de percepción del cliente.", "orientacion": "Encuestas, reclamos y devoluciones."}], "actividad": "Elabora un tablero con tres fuentes de percepción de tus clientes y su frecuencia de análisis.", "resumen": "El control operacional protege la entrega. La satisfacción se observa con varias fuentes y se usa para decidir y mejorar.", "glosario": [["Salida no conforme", "Producto o servicio que no cumple requisitos."], ["Percepción del cliente", "Opinión sobre el cumplimiento de sus necesidades."], ["Reclamo", "Expresión de insatisfacción."], ["Revisión por la dirección", "Evaluación periódica del sistema."]], "bibliografia": ["ISO 9001:2015. Sistemas de gestión de la calidad. Requisitos (y Enmienda 1:2024, por verificar).", "ISO 9000:2015. Sistemas de gestión de la calidad. Fundamentos y vocabulario.", "ISO 22301:2019. Seguridad y resiliencia. Sistemas de gestión de continuidad del negocio. Requisitos.", "ISO 31000:2018. Gestión del riesgo. Directrices.", "ISO 19011:2018. Directrices para la auditoría de los sistemas de gestión."]}, {"id": "m19", "titulo": "Módulo 19. Planes de contingencia y respuesta ante riesgos materializados", "temas": [{"id": "m19t1", "titulo": "Distinguir conceptos", "tags": [["tprop", "METODOLOGÍA ACADEMIA SGI"], ["t31000", "ISO 31000:2018"], ["tiso", "ISO 22301:2019"]], "tipo": "Metodología / Directriz", "trazabilidad": "Distinción propia de Academia SGI; ISO 31000 (tratamiento) e ISO 22301 (continuidad). Numerales y enmiendas por verificar contra el texto oficial vigente. Contenido original de Academia SGI.", "texto": "Tratamiento: decisiones para modificar el riesgo antes de que ocurra. Contingencia: plan para actuar si el riesgo se materializa. Respuesta a incidentes: acciones inmediatas ante el evento. Continuidad: mantener o reanudar funciones críticas. Recuperación: volver a la normalidad. Acción correctiva: eliminar la causa para que no se repita.\n\nConfundirlos produce planes que no se activan o no se ejecutan."}, {"id": "m19t2", "titulo": "Estructura antes, durante y después", "tags": [["tprop", "METODOLOGÍA ACADEMIA SGI"]], "tipo": "Metodología", "trazabilidad": "Metodología propia Academia SGI. Numerales y enmiendas por verificar contra el texto oficial vigente. Contenido original de Academia SGI.", "texto": "Antes: escenario, criterios de activación, equipo, recursos y simulacros. Durante: acciones inmediatas, contención, protección de personas, activos e información, comunicación y conservación de evidencias. Después: recuperación, evaluación de daños, lecciones aprendidas y acciones correctivas.\n\nEjemplo (soborno): ante una sospecha, se suspenden los pagos al tercero, se preserva evidencia y se informa a la función de cumplimiento."}, {"id": "m19t3", "titulo": "Criterios de activación y simulacros", "tags": [["tprop", "METODOLOGÍA ACADEMIA SGI"], ["tiso", "ISO 22301:2019"]], "tipo": "Metodología / Buena práctica", "trazabilidad": "Metodología Academia SGI. ISO 22301 recoge ejercicios y pruebas como parte de la continuidad. Numerales y edición por verificar contra el texto oficial. Contenido original de Academia SGI.", "texto": "Un criterio de activación es una condición observable que dispara el plan (por ejemplo, «pérdida de sistema crítico por más de 30 minutos»). Sin criterio, nadie decide o todos deciden distinto.\n\nLos simulacros pueden ser de mesa (se discute el escenario) o prácticos (se ejecutan acciones). Cada uno deja lecciones y ajustes."}], "preguntas": [{"id": "m19q1", "tipo": "mc", "nivel": "Intermedio", "texto": "El plan de contingencia sirve para:", "opciones": ["Reducir la probabilidad antes del evento", "Actuar si el riesgo ya se materializó", "Sustituir la evaluación de riesgos", "Certificar el sistema"], "correcta": 1, "fuente": "Metodología Academia SGI", "competencia": "Contingencias", "remedial": "Estudiar Módulo 19, tema 1"}, {"id": "m19q2", "tipo": "vf", "nivel": "Intermedio", "texto": "Una acción correctiva y una contingencia son lo mismo.", "opciones": ["Verdadero", "Falso"], "correcta": 1, "fuente": "Metodología Academia SGI", "competencia": "Contingencias", "remedial": "Estudiar Módulo 19, tema 1"}, {"id": "m19q3", "tipo": "mc", "nivel": "Básico", "texto": "Un criterio de activación sirve para:", "opciones": ["Decidir cuándo se usa el plan", "Evitar riesgos", "Calcular impacto", "Auditar"], "correcta": 0, "fuente": "Metodología Academia SGI", "competencia": "Contingencias", "remedial": "Estudiar Módulo 19, tema 3"}, {"id": "m19q4", "tipo": "vf", "nivel": "Avanzado", "texto": "Un plan que nunca se prueba está validado.", "opciones": ["Verdadero", "Falso"], "correcta": 1, "fuente": "Metodología Academia SGI", "competencia": "Contingencias", "remedial": "Estudiar Módulo 19, tema 3"}, {"id": "m19q5", "tipo": "mc", "nivel": "Profesional", "texto": "Plan sin criterio de activación y sin responsable. ¿Qué pasa?", "opciones": ["Decisiones tardías o contradictorias", "Nada", "Se ejecuta mejor", "Se elimina el riesgo"], "correcta": 0, "fuente": "Metodología Academia SGI", "competencia": "Contingencias", "remedial": "Estudiar Módulo 19, tema 3"}, {"id": "m19q6", "tipo": "mc", "nivel": "Profesional", "texto": "Un simulacro de mesa consiste en:", "opciones": ["Discutir el escenario y las decisiones", "Ejecutar una evacuación real", "Auditar proveedores", "Comprar equipos"], "correcta": 0, "fuente": "Metodología Academia SGI", "competencia": "Contingencias", "remedial": "Estudiar Módulo 19, tema 3"}], "intro": "Un plan que no se ensaya es una hipótesis. Aquí se aprende a decidir cuándo activarlo y a comprobar que funciona.", "objetivos": ["Distinguir tratamiento, contingencia, respuesta, continuidad, recuperación y acción correctiva.", "Definir criterios de activación claros.", "Planificar simulacros."], "competencias": ["Contingencias"], "casos": [{"titulo": "Caso: Hospital Central", "texto": "Un hospital ficticio tiene un plan para caída de sistemas, pero nunca lo probó y nadie sabe quién lo activa. Define criterios y un simulacro de mesa."}], "ejercicios": [{"titulo": "Ejercicio", "texto": "Redacta un criterio de activación para pérdida de sistema crítico.", "orientacion": "Ejemplo: indisponibilidad superior a 30 minutos confirmada por TI."}], "actividad": "Define el criterio de activación de un plan de tu organización y programa un simulacro de mesa.", "resumen": "Los conceptos se distinguen para no confundir planes. Los criterios de activación y los simulacros vuelven operativo el plan.", "glosario": [["Contingencia", "Plan para actuar si el riesgo se materializa."], ["Criterio de activación", "Condición que dispara un plan."], ["Simulacro", "Ejercicio para probar un plan."], ["Lección aprendida", "Hallazgo útil tras un ejercicio o evento."]], "bibliografia": ["ISO 9001:2015. Sistemas de gestión de la calidad. Requisitos (y Enmienda 1:2024, por verificar).", "ISO 9000:2015. Sistemas de gestión de la calidad. Fundamentos y vocabulario.", "ISO 22301:2019. Seguridad y resiliencia. Sistemas de gestión de continuidad del negocio. Requisitos.", "ISO 31000:2018. Gestión del riesgo. Directrices.", "ISO 19011:2018. Directrices para la auditoría de los sistemas de gestión."]}, {"id": "m20", "titulo": "Módulo 20. Continuidad operativa, recuperación y gestión de crisis", "temas": [{"id": "m20t1", "titulo": "Continuidad y análisis de impacto", "tags": [["tiso", "ISO 22301:2019"], ["tcomp", "COMPLEMENTARIO"]], "tipo": "Directriz / Buena práctica", "trazabilidad": "Fuente: ISO 22301:2019 (otra norma ISO; requisitos propios, no de ISO 9001 ni 37001). Numerales y enmiendas por verificar contra el texto oficial vigente. Contenido original de Academia SGI.", "texto": "Se identifican funciones críticas mediante el análisis de impacto en el negocio, y se definen el tiempo máximo tolerable de interrupción, el objetivo de tiempo de recuperación (RTO) y el de punto de recuperación (RPO). Con ellos se eligen estrategias: sitios alternos, respaldos, proveedores alternativos.\n\nEjemplo (transporte): si el sistema de despacho cae, se define cuánto tiempo puede operarse manualmente."}, {"id": "m20t2", "titulo": "Gestión de crisis", "tags": [["tiso", "ISO 22301:2019"], ["tprop", "METODOLOGÍA ACADEMIA SGI"]], "tipo": "Buena práctica / Metodología", "trazabilidad": "ISO 22301 y metodología propia. Numerales y enmiendas por verificar contra el texto oficial vigente. Contenido original de Academia SGI.", "texto": "Un equipo de crisis con roles definidos decide, coordina y comunica. Mensajes coherentes a empleados, clientes, autoridades y medios; una sola vocería. Tras la crisis se evalúa la respuesta y se actualizan riesgos y planes."}, {"id": "m20t3", "titulo": "Análisis de impacto paso a paso", "tags": [["tiso", "ISO 22301:2019"], ["tprop", "METODOLOGÍA ACADEMIA SGI"]], "tipo": "Directriz / Metodología", "trazabilidad": "ISO 22301:2019 trata el análisis de impacto; los pasos aquí son una versión didáctica propia. Numerales y edición por verificar contra el texto oficial. Contenido original de Academia SGI.", "texto": "1) Listar procesos. 2) Estimar el impacto de interrumpirlos por horas, días y semanas. 3) Fijar el tiempo máximo tolerable. 4) Definir RTO y RPO. 5) Elegir estrategias y recursos.\n\nEjemplo (educación): si el sistema de notas cae, se tolera trabajar manualmente 48 horas; el RTO es 24 horas y el RPO es el último respaldo diario."}], "preguntas": [{"id": "m20q1", "tipo": "mc", "nivel": "Intermedio", "texto": "El RTO es:", "opciones": ["El tiempo objetivo para recuperar una función", "El presupuesto de riesgos", "Un tipo de auditoría", "El nivel de apetito"], "correcta": 0, "fuente": "ISO 22301:2019", "competencia": "Continuidad", "remedial": "Estudiar Módulo 20, tema 1"}, {"id": "m20q2", "tipo": "vf", "nivel": "Intermedio", "texto": "Durante una crisis conviene que varias personas comuniquen mensajes distintos.", "opciones": ["Verdadero", "Falso"], "correcta": 1, "fuente": "Metodología Academia SGI", "competencia": "Gestión de crisis", "remedial": "Estudiar Módulo 20, tema 2"}, {"id": "m20q3", "tipo": "mc", "nivel": "Básico", "texto": "El RPO se refiere a:", "opciones": ["La antigüedad máxima de datos aceptable", "El tiempo de auditoría", "El precio", "El responsable"], "correcta": 0, "fuente": "ISO 22301:2019", "competencia": "Continuidad", "remedial": "Estudiar Módulo 20, tema 1"}, {"id": "m20q4", "tipo": "vf", "nivel": "Avanzado", "texto": "RTO y RPO significan lo mismo.", "opciones": ["Verdadero", "Falso"], "correcta": 1, "fuente": "ISO 22301:2019", "competencia": "Continuidad", "remedial": "Estudiar Módulo 20, tema 3"}, {"id": "m20q5", "tipo": "mc", "nivel": "Profesional", "texto": "Respaldo de ayer, RPO tolerado de 1 hora. ¿Qué ocurre?", "opciones": ["No se cumple el RPO", "Se cumple", "No aplica", "Solo importa el RTO"], "correcta": 0, "fuente": "ISO 22301:2019", "competencia": "Continuidad", "remedial": "Estudiar Módulo 20, tema 3"}, {"id": "m20q6", "tipo": "mc", "nivel": "Profesional", "texto": "El primer paso del análisis de impacto es:", "opciones": ["Listar procesos", "Comprar equipos", "Cerrar procesos", "Auditar"], "correcta": 0, "fuente": "ISO 22301:2019", "competencia": "Continuidad", "remedial": "Estudiar Módulo 20, tema 3"}], "intro": "La continuidad empieza por saber qué es crítico y cuánto tiempo se puede esperar. Después vienen las estrategias.", "objetivos": ["Realizar un análisis de impacto básico.", "Interpretar RTO y RPO.", "Preparar la gestión de crisis."], "competencias": ["Continuidad"], "c 001:2015 / ISO 37001", "competencia": "Acciones correctivas", "remedial": "Estudiar Módulo 21, tema 1"}, {"id": "m21q2", "tipo": "vf", "nivel": "Intermedio", "texto": "ISO 31000 y COSO ERM son equivalentes e intercambiables.", "opciones": ["Verdadero", "Falso"], "correcta": 1, "fuente": "ISO 31000:2018 / COSO ERM 2017", "competencia": "Integración de sistemas", "remedial": "Estudiar Módulo 21, tema 2"}, {"id": "m21q3", "tipo": "mc", "nivel": "Básico", "texto": "La verificación de eficacia comprueba:", "opciones": ["Que la acción logró evitar la repetición", "Que se firmó el acta", "Que se pagó", "Que se archivó"], "correcta": 0, "fuente": "ISO 9001:2015 (por verificar)", "competencia": "Acciones correctivas", "remedial": "Estudiar Módulo 21, tema 3"}, {"id": "m21q4", "tipo": "vf", "nivel": "Avanzado", "texto": "Corregir el efecto equivale a eliminar la causa.", "opciones": ["Verdadero", "Falso"], "correcta": 1, "fuente": "ISO 9001:2015 (por verificar)", "competencia": "Acciones correctivas", "remedial": "Estudiar Módulo 21, tema 1"}, {"id": "m21q5", "tipo": "mc", "nivel": "Profesional", "texto": "Un defecto se repite tras corregir el lote. ¿Qué faltó?", "opciones": ["Analizar y eliminar la causa", "Más inspección", "Cambiar el cliente", "Nada"], "correcta": 0, "fuente": "ISO 9001:2015 (por verificar)", "competencia": "Acciones correctivas", "remedial": "Estudiar Módulo 21, tema 3"}, {"id": "m21q6", "tipo": "mc", "nivel": "Profesional", "texto": "Los 5 porqués deben validarse con:", "opciones": ["Datos", "Suposiciones", "Opiniones del gerente", "Ninguno"], "correcta": 0, "fuente": "Metodología Academia SGI", "competencia": "Acciones correctivas", "remedial": "Estudiar Módulo 21, tema 3"}], "intro": "Cerrar una acción no es lo mismo que resolver el problema. Este módulo une brecha, causa, plan y verificación.", "objetivos": ["Analizar causas con una técnica sencilla.", "Diseñar acciones correctivas verificables.", "Cerrar el ciclo de mejora y mantener la trazabilidad.  (m.casos?`<div class="card"><h2>Casos prácticos</h2>${m.casos.map(c=>`<p><b>${esc(c.titulo)}</b><br>${esc(c.texto)}</p>`).join('')}</div><div class="card"><h2>Ejercicios</h2>${m.ejercicios.map(e=>`<p><b>${esc(e.titulo)}</b><br>${esc(e.texto)}</p><details><summary>Orientación de respuesta</summary><p>${esc(e.orientacion)}</p></details>`).join('')}</div><div class="card"><h2>Actividad práctica</h2><p>${esc(m.actividad)}</p><h2>Resumen</h2><p>${esc(m.resumen)}</p></div><details class="card"><summary><b>Glosario</b></summary>${m.glosario.map(g=>`<p><b>${esc(g[0])}:</b> ${esc(g[1])}</p>`).join('')}</details><details class="card"><summary><b>Bibliografía</b></summary><ul>${L(m.bibliografia)}</ul></details>`:'')}

 let h=`<select id="lv"><option value="">Todos los niveles</option>${['Básico','Intermedio','Avanzado','Profesional'].map(n=>`<option ${n===lv?'selected':''}>${n}</option>`).join('')}</select>`;
 if(res){h+=`<div class="card"><h2>Resultado: ${res.pct}%</h2>${res.gaps.length?'<p><b>Brechas posibles (orientativas):</b></p>'+res.gaps.map(g=>`<p>• ${esc(g.competencia)} → ${esc(g.remedial)}<br><small>${esc(g.fuente)}</small></p>`).join(''):'<p>Sin brechas detectadas.</p>'}<button class="alt" id="rs">Repetir</button></div>`;return h}
