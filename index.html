<script>
const D=[{"id": "m01", "titulo": "Módulo 1. Fundamentos de los sistemas de gestión integrados", "intro": "Toda organización decide, actúa y corrige, con o sin sistema. Un sistema de gestión hace que esas tres acciones sean deliberadas, repetibles y verificables. Este módulo construye el vocabulario y los criterios que usarás en los 20 módulos siguientes: qué es un sistema de gestión, de qué se compone, cómo se estructuran las normas ISO, qué significa integrarlas y cómo distinguir requisitos, directrices y marcos.", "objetivos": ["Explicar qué es un sistema de gestión y qué elementos lo componen.", "Describir el ciclo PDCA y ubicar en él las actividades de un sistema.", "Reconocer la estructura común de las normas ISO de sistemas de gestión.", "Distinguir requisito, directriz y marco metodológico.", "Describir qué se integra, qué beneficios aporta y qué riesgos tiene integrar mal."], "competencias": ["Comprensión de sistemas de gestión", "Integración de sistemas", "Distinción requisito/directriz"], "temas": [{"id": "m01t1", "titulo": "¿Qué es un sistema de gestión?", "tags": [["t9001", "ISO 9001:2015"], ["tcomp", "COMPLEMENTARIO"]], "tipo": "Principio", "trazabilidad": "Fuente: ISO 9001:2015 y ISO 9000:2015 (fundamentos y vocabulario). Numerales y edición por verificar contra el texto oficial. Contenido original de Academia SGI.", "texto": "Un sistema de gestión es el conjunto de elementos interrelacionados de una organización —política, objetivos, procesos, roles, recursos e información— establecidos para lograr resultados planificados. No es un manual ni un software: es la forma sistemática en que la organización decide, actúa, verifica y mejora.\n\nSu valor está en convertir intenciones en prácticas repetibles y verificables. Ejemplo (construcción): una constructora fija el objetivo de cero retrabajos en acabados; establece un proceso de inspección, responsables, registros y un indicador mensual.\n\nEjemplo (educación): una escuela fija el objetivo de reducir la deserción; define quién detecta alertas, qué se hace ante cada una y cómo se mide el resultado cada trimestre."}, {"id": "m01t2", "titulo": "Elementos del sistema y ciclo PDCA", "tags": [["t9001", "ISO 9001:2015"], ["tprop", "METODOLOGÍA ACADEMIA SGI"]], "tipo": "Principio / Metodología", "trazabilidad": "ISO 9001:2015 (enfoque PDCA). La lectura por elementos es didáctica, de Academia SGI. Numerales y edición por verificar contra el texto oficial. Contenido original de Academia SGI.", "texto": "Elementos típicos: contexto y partes interesadas, política, objetivos, roles y autoridades, procesos, recursos y competencias, información documentada, seguimiento y medición, auditoría interna, revisión por la dirección y mejora.\n\nEl ciclo PDCA los ordena: Planificar (objetivos, riesgos, procesos), Hacer (implementar y operar), Verificar (seguimiento, medición, auditoría) y Actuar (corregir y mejorar). Un sistema que planifica y hace, pero no verifica ni actúa, se estanca.\n\nEjemplo (servicios): un centro de atención planifica un tiempo máximo de respuesta, lo opera, mide semanalmente y ajusta turnos cuando se excede."}, {"id": "m01t3", "titulo": "Estructura común de las normas ISO de gestión", "tags": [["t9001", "ISO 9001:2015"], ["t37001", "ISO 37001:2025"], ["tcomp", "COMPLEMENTARIO"]], "tipo": "Componente metodológico", "trazabilidad": "Estructura común de alto nivel de las normas ISO de sistemas de gestión (Anexo SL de las Directivas ISO/IEC). Verificar su aplicación exacta en cada norma y edición. Numerales y edición por verificar contra el texto oficial. Contenido original de Academia SGI.", "texto": "Las normas ISO de sistemas de gestión comparten una estructura de diez capítulos: alcance, referencias normativas, términos, contexto, liderazgo, planificación, apoyo, operación, evaluación del desempeño y mejora. Los requisitos auditables se concentran en los capítulos 4 a 10.\n\nEsa estructura facilita la integración, pero el contenido específico sigue siendo propio de cada norma: por ejemplo, la debida diligencia en antisoborno o el control de proveedores externos en calidad."}, {"id": "m01t4", "titulo": "Integrar sistemas de gestión", "tags": [["tint", "INTEGRADO"], ["t9001", "ISO 9001:2015"], ["t37001", "ISO 37001:2025"]], "tipo": "Buena práctica", "trazabilidad": "Integración como buena práctica: no es requisito de ISO 9001 ni de ISO 37001. Numerales y edición por verificar contra el texto oficial. Contenido original de Academia SGI.", "texto": "Integrar es compartir elementos comunes entre sistemas para evitar duplicar esfuerzos: política y objetivos coordinados, procesos y registros comunes, un solo programa de auditorías internas y una revisión por la dirección conjunta.\n\nBeneficios: menos documentos duplicados, auditorías más eficientes y una visión única de riesgos. Riesgos de integrar mal: diluir requisitos específicos, perder trazabilidad de la norma que exige cada cosa o creer que una auditoría integrada reemplaza la verificación de cada requisito.\n\nIntegrar no fusiona las normas ni las hace equivalentes: cada una se evalúa y se certifica por separado."}, {"id": "m01t5", "titulo": "Requisitos, directrices y marcos", "tags": [["t9001", "ISO 9001:2015"], ["t37001", "ISO 37001:2025"], ["t31000", "ISO 31000:2018"], ["t19011", "ISO 19011:2018"], ["tcoso", "COSO ERM 2017"]], "tipo": "Principio", "trazabilidad": "ISO 9001 e ISO 37001 contienen requisitos; ISO 31000 e ISO 19011 son directrices; COSO ERM es un marco publicado por COSO, no una norma ISO. Numerales y edición por verificar contra el texto oficial. Contenido original de Academia SGI.", "texto": "En las normas ISO se usa «debe» para requisitos, «debería» para recomendaciones y «puede» para permisos. ISO 9001 e ISO 37001 son normas de requisitos y pueden certificarse. ISO 31000 e ISO 19011 ofrecen directrices: no se certifican. COSO ERM 2017 es un marco metodológico independiente de ISO.\n\nUna regla de oro de esta academia: nunca atribuyas a una norma lo que pertenece a otra, ni presentes una recomendación como si fuera una obligación."}], "casos": [{"titulo": "Caso 1 (construcción): Constructora Andina", "texto": "Constructora Andina, empresa ficticia, tiene un sistema de calidad basado en ISO 9001 y quiere añadir un sistema antisoborno por su relación con entidades que otorgan licencias. La gerencia propone «copiar» sus procedimientos de calidad y cambiar el título. Analiza: ¿qué elementos puede compartir (política, auditorías, revisión por la dirección)? ¿Qué requiere controles propios que ISO 9001 no pide?"}, {"titulo": "Caso 2 (salud): Clínica del Valle", "texto": "Una clínica ficticia integra calidad y gestión de riesgos. En su primera auditoría integrada, el auditor solo verifica un conjunto de registros y da por cumplidos todos los requisitos de ambos sistemas. Analiza qué riesgo de integración mal hecha aparece y cómo corregirlo."}], "ejercicios": [{"titulo": "Ejercicio 1: clasifica", "texto": "Clasifica como requisito, directriz o marco: (a) ISO 9001; (b) ISO 31000; (c) COSO ERM; (d) ISO 19011.", "orientacion": "(a) Requisitos certificables; (b) Directrices; (c) Marco de COSO, no ISO; (d) Directrices."}, {"titulo": "Ejercicio 2: elementos", "texto": "En el ejemplo de la escuela, identifica objetivo, indicador, responsable, proceso y acción de mejora.", "orientacion": "Objetivo: reducir deserción. Indicador: tasa trimestral. Responsable y proceso: definidos para detectar y actuar. Mejora: ajustar alertas según resultados."}, {"titulo": "Ejercicio 3: objetivo medible", "texto": "Redacta un objetivo medible para un proceso de tu organización (qué, cuánto y para cuándo).", "orientacion": "Ejemplo: reducir de 8 % a 4 % los pedidos entregados fuera de plazo antes del cierre del próximo semestre."}], "actividad": "Elige un proceso real de tu organización y regístralo en la herramienta «Integración»: objetivo, y para cada referencia, el requisito o principio que aplica y su tipo de disposición. Deja los numerales como «por verificar» hasta contrastarlos con las normas.", "resumen": "Un sistema de gestión es la forma sistemática de decidir, actuar, verificar y mejorar. Sus elementos se ordenan en el ciclo PDCA. Las normas ISO comparten una estructura común que facilita integrarlas, pero cada una conserva requisitos propios. Hay que distinguir requisitos (ISO 9001, ISO 37001), directrices (ISO 31000, ISO 19011) y marcos (COSO ERM).", "glosario": [["Sistema de gestión", "Conjunto de elementos interrelacionados para establecer política, objetivos y lograr resultados."], ["Política", "Orientación e intenciones de la organización formalizadas por la alta dirección."], ["Objetivo", "Resultado que se busca lograr; debe ser medible."], ["Proceso", "Actividades relacionadas que transforman entradas en salidas."], ["Información documentada", "Información que la organización debe controlar y mantener, en cualquier formato."], ["Parte interesada", "Persona u organización que puede afectar o verse afectada por las decisiones."], ["Requisito", "Disposición obligatoria para quien se evalúa contra la norma («debe»)."], ["Directriz", "Orientación no certificable («debería»)."], ["Marco", "Estructura metodológica de referencia, como COSO ERM."], ["PDCA", "Ciclo Planificar-Hacer-Verificar-Actuar."], ["Integración", "Compartir elementos comunes entre sistemas sin fusionar sus requisitos."]], "bibliografia": ["ISO 9001:2015. Sistemas de gestión de la calidad. Requisitos.", "ISO 9000:2015. Sistemas de gestión de la calidad. Fundamentos y vocabulario.", "ISO 37001 (edición vigente). Sistemas de gestión antisoborno. Requisitos con orientación para su uso.", "ISO 31000:2018. Gestión del riesgo. Directrices.", "ISO 19011:2018. Directrices para la auditoría de los sistemas de gestión.", "COSO (2017). Enterprise Risk Management: Integrating with Strategy and Performance.", "ISO/IEC Directives, Part 1, Consolidated ISO Supplement (estructura común para normas de sistemas de gestión)."], "preguntas": [{"id": "m01q1", "tipo": "mc", "nivel": "Básico", "texto": "¿Cuál describe mejor un sistema de gestión?", "opciones": ["Un software de contabilidad", "Elementos interrelacionados para lograr resultados planificados", "Un manual impreso", "Una auditoría anual"], "correcta": 1, "fuente": "ISO 9000:2015 (por verificar)", "competencia": "Comprensión de sistemas de gestión", "remedial": "Estudiar Módulo 1, tema 1"}, {"id": "m01q2", "tipo": "vf", "nivel": "Básico", "texto": "El ciclo PDCA incluye verificar y actuar, no solo planificar y hacer.", "opciones": ["Verdadero", "Falso"], "correcta": 0, "fuente": "ISO 9001:2015", "competencia": "Comprensión de sistemas de gestión", "remedial": "Estudiar Módulo 1, tema 2"}, {"id": "m01q3", "tipo": "mc", "nivel": "Intermedio", "texto": "¿En qué capítulos se concentran los requisitos auditables de la estructura común?", "opciones": ["1 a 3", "4 a 10", "Solo el 10", "Solo el 4"], "correcta": 1, "fuente": "Estructura común ISO (por verificar)", "competencia": "Comprensión de sistemas de gestión", "remedial": "Estudiar Módulo 1, tema 3"}, {"id": "m01q4", "tipo": "vf", "nivel": "Intermedio", "texto": "Integrar sistemas implica que sus requisitos pasan a ser equivalentes.", "opciones": ["Verdadero", "Falso"], "correcta": 1, "fuente": "Buena práctica (no es requisito ISO)", "competencia": "Integración de sistemas", "remedial": "Estudiar Módulo 1, tema 4"}, {"id": "m01q5", "tipo": "mc", "nivel": "Avanzado", "texto": "¿Cuál de estas afirmaciones es correcta?", "opciones": ["ISO 31000 es certificable", "COSO ERM es una norma ISO", "ISO 9001 contiene requisitos certificables", "ISO 19011 contiene requisitos certificables"], "correcta": 2, "fuente": "ISO 9001 / ISO 31000 / COSO / ISO 19011", "competencia": "Distinción requisito/directriz", "remedial": "Estudiar Módulo 1, tema 5"}, {"id": "m01q6", "tipo": "mc", "nivel": "Avanzado", "texto": "En una norma ISO, «debería» indica:", "opciones": ["Un requisito", "Una recomendación", "Un permiso", "Una prohibición"], "correcta": 1, "fuente": "Convenciones de redacción ISO (por verificar)", "competencia": "Distinción requisito/directriz", "remedial": "Estudiar Módulo 1, tema 5"}, {"id": "m01q7", "tipo": "mc", "nivel": "Profesional", "texto": "Una auditoría integrada revisa un solo conjunto de registros y da por cumplidos los requisitos de ambos sistemas. ¿Qué riesgo ilustra?", "opciones": ["Ninguno, es una eficiencia", "Diluir requisitos específicos y perder trazabilidad por norma", "Exceso de documentos", "Falta de política"], "correcta": 1, "fuente": "Buena práctica de integración", "competencia": "Integración de sistemas", "remedial": "Estudiar Módulo 1, tema 4"}, {"id": "m01q8", "tipo": "mc", "nivel": "Profesional", "texto": "Una empresa con ISO 9001 quiere implantar un sistema antisoborno copiando sus procedimientos de calidad. ¿Qué conviene?", "opciones": ["Cambiar solo el título", "Compartir elementos comunes y añadir controles propios del soborno", "Descartar ISO 9001", "No hacer nada"], "correcta": 1, "fuente": "ISO 9001 / ISO 37001", "competencia": "Integración de sistemas", "remedial": "Estudiar Módulo 1, tema 4"}]}, {"id": "m02", "titulo": "Módulo 2. Principios y fundamentos de gestión de riesgos", "temas": [{"id": "m02t1", "titulo": "Principios de ISO 31000", "tags": [["t31000", "ISO 31000:2018"], ["tcomp", "COMPLEMENTARIO"]], "tipo": "Principio", "trazabilidad": "Fuente: ISO 31000:2018. Es una directriz, no un requisito certificable. Numerales por verificar. Contenido original de Academia SGI.", "texto": "ISO 31000 propone principios que orientan una gestión del riesgo eficaz: integrada, estructurada y exhaustiva, adaptada, inclusiva, dinámica, basada en la mejor información disponible, que considera factores humanos y culturales, y de mejora continua.\n\nSe trata de directrices: una organización no se certifica contra ISO 31000."}, {"id": "m02t2", "titulo": "Marco de trabajo y proceso", "tags": [["t31000", "ISO 31000:2018"]], "tipo": "Directriz", "trazabilidad": "Fuente: ISO 31000:2018. Numerales por verificar. Contenido original de Academia SGI.", "texto": "El marco (liderazgo y compromiso, integración, diseño, implementación, evaluación y mejora) define cómo la organización incorpora la gestión del riesgo. El proceso (comunicación y consulta, alcance, contexto y criterios, evaluación, tratamiento, seguimiento y revisión, registro e informe) es lo que se aplica a cada decisión o actividad.\n\nEjemplo (salud): un hospital aplica el proceso a la compra de un equipo de diagnóstico, y el marco asegura que lo haga de la misma forma en toda la institución."}, {"id": "m02t3", "titulo": "Riesgo, oportunidad y valor", "tags": [["t31000", "ISO 31000:2018"], ["tcoso", "COSO ERM 2017"]], "tipo": "Principio / Componente", "trazabilidad": "ISO 31000:2018 (definición de riesgo) y COSO ERM 2017 (creación y preservación de valor). Numerales y edición por verificar contra el texto oficial. Contenido original de Academia SGI.", "texto": "ISO 31000 define el riesgo como el efecto de la incertidumbre sobre los objetivos; ese efecto puede ser negativo, positivo o ambos. Por eso gestionar riesgos también implica detectar oportunidades.\n\nCOSO ERM enfoca la gestión de riesgos en crear, preservar y realizar valor. Ambos enfoques coinciden en que no se trata de eliminar el riesgo, sino de tomar decisiones informadas. Ejemplo (comercio): abrir un nuevo canal digital es un riesgo con potencial de ganancia, no solo de pérdida."}], "preguntas": [{"id": "m02q1", "tipo": "vf", "nivel": "Intermedio", "texto": "ISO 31000 contiene requisitos que permiten certificar a una organización.", "opciones": ["Verdadero", "Falso"], "correcta": 1, "fuente": "ISO 31000:2018 (directrices)", "competencia": "Fundamentos de gestión de riesgos", "remedial": "Estudiar Módulo 2, tema 1"}, {"id": "m02q2", "tipo": "mc", "nivel": "Intermedio", "texto": "¿Qué distingue al marco de trabajo del proceso de gestión de riesgos?", "opciones": ["El marco es cómo se integra la gestión del riesgo; el proceso es lo que se aplica a cada actividad", "Son sinónimos", "El proceso es solo para auditores", "El marco solo aplica a riesgos financieros"], "correcta": 0, "fuente": "ISO 31000:2018", "competencia": "Fundamentos de gestión de riesgos", "remedial": "Estudiar Módulo 2, tema 2"}, {"id": "m02q3", "tipo": "mc", "nivel": "Básico", "texto": "Según ISO 31000, el riesgo es:", "opciones": ["Solo una pérdida", "El efecto de la incertidumbre sobre los objetivos", "Un incidente ocurrido", "Un control"], "correcta": 1, "fuente": "ISO 31000:2018", "competencia": "Fundamentos de gestión de riesgos", "remedial": "Estudiar Módulo 2, tema 3"}, {"id": "m02q4", "tipo": "vf", "nivel": "Avanzado", "texto": "El riesgo siempre tiene efectos negativos.", "opciones": ["Verdadero", "Falso"], "correcta": 1, "fuente": "ISO 31000:2018", "competencia": "Fundamentos de gestión de riesgos", "remedial": "Estudiar Módulo 2, tema 3"}, {"id": "m02q5", "tipo": "mc", "nivel": "Profesional", "texto": "Una empresa solo revisa riesgos tras cada accidente. ¿Qué falta según ISO 31000?", "opciones": ["Un proceso integrado y anticipado a las decisiones", "Más seguros", "Un auditor externo", "Nada"], "correcta": 0, "fuente": "ISO 31000:2018", "competencia": "Fundamentos de gestión de riesgos", "remedial": "Estudiar Módulo 2, tema 2"}, {"id": "m02q6", "tipo": "mc", "nivel": "Profesional", "texto": "¿Qué opción confunde correctamente norma con marco?", "opciones": ["COSO ERM es una norma ISO", "ISO 31000 no es certificable; COSO ERM es un marco de COSO", "ISO 31000 exige una matriz 5×5", "COSO ERM es certificable por ISO"], "correcta": 1, "fuente": "ISO 31000:2018 / COSO ERM 2017", "competencia": "Fundamentos de gestión de riesgos", "remedial": "Estudiar Módulo 2, tema 1"}], "intro": "Gestionar riesgos no es evitar toda incertidumbre, sino decidir mejor con ella. Este módulo presenta la lógica de ISO 31000: principios, marco y proceso.", "objetivos": ["Enunciar los principios de ISO 31000.", "Diferenciar marco de trabajo y proceso.", "Explicar que ISO 31000 es una directriz no certificable."], "competencias": ["Fundamentos de gestión de riesgos"], "casos": [{"titulo": "Caso: Transportes del Norte", "texto": "Una empresa ficticia de transporte revisa riesgos solo después de cada accidente. Propón cómo el marco y el proceso de ISO 31000 le permitirían decidir antes de que ocurran."}], "ejercicios": [{"titulo": "Ejercicio", "texto": "Indica cuáles son parte del marco y cuáles del proceso: liderazgo y compromiso, evaluación del riesgo, mejora del marco, seguimiento y revisión.", "orientacion": "Marco: liderazgo y compromiso, mejora del marco. Proceso: evaluación del riesgo, seguimiento y revisión."}], "actividad": "Describe cómo toma hoy decisiones de riesgo tu organización e identifica una decisión donde el proceso de ISO 31000 aportaría criterios.", "resumen": "ISO 31000 propone principios, un marco y un proceso. Son directrices, no requisitos certificables. El riesgo es el efecto de la incertidumbre sobre los objetivos y puede ser positivo o negativo.", "glosario": [["Riesgo", "Efecto de la incertidumbre sobre los objetivos."], ["Marco", "Estructura que integra la gestión del riesgo en la organización."], ["Proceso", "Aplicación sistemática de políticas y prácticas al riesgo."], ["Directriz", "Orientación no certificable."]], "bibliografia": ["ISO 31000:2018. Gestión del riesgo. Directrices.", "ISO 31010:2019. Gestión del riesgo. Técnicas de evaluación del riesgo.", "COSO (2017). Enterprise Risk Management: Integrating with Strategy and Performance.", "ISO 9001:2015. Sistemas de gestión de la calidad. Requisitos.", "ISO 19011:2018. Directrices para la auditoría de los sistemas de gestión."]}, {"id": "m03", "titulo": "Módulo 3. Contexto organizacional, partes interesadas y objetivos", "temas": [{"id": "m03t1", "titulo": "Contexto interno y externo", "tags": [["t9001", "ISO 9001:2015"], ["t31000", "ISO 31000:2018"]], "tipo": "Requisito / Directriz", "trazabilidad": "ISO 9001:2015 exige determinar cuestiones internas y externas pertinentes (requisito). ISO 31000 lo trata como establecimiento del contexto (directriz). Numerales por verificar. Contenido original de Academia SGI.", "texto": "El contexto reúne los factores internos (cultura, recursos, procesos, tecnología) y externos (regulación, mercado, economía, competencia) que afectan la capacidad de lograr resultados. Es la base para identificar riesgos relevantes.\n\nEjemplo (comercio): una cadena minorista advierte que un cambio arancelario (externo) y su dependencia de un solo proveedor (interno) condicionan su abastecimiento."}, {"id": "m03t2", "titulo": "Partes interesadas y objetivos", "tags": [["t9001", "ISO 9001:2015"], ["tcoso", "COSO ERM 2017"]], "tipo": "Requisito / Componente metodológico", "trazabilidad": "ISO 9001:2015 (partes interesadas pertinentes) y COSO ERM, componente Estrategia y establecimiento de objetivos. Numerales por verificar. Contenido original de Academia SGI.", "texto": "Una parte interesada es quien puede afectar o verse afectada por las decisiones de la organización. Se identifican sus necesidades y expectativas pertinentes y se vinculan con los objetivos.\n\nCOSO ERM conecta los objetivos con la estrategia y con el apetito de riesgo: un objetivo sin análisis de riesgo es una apuesta, no un plan."}, {"id": "m03t3", "titulo": "Técnicas para analizar el contexto", "tags": [["tprop", "METODOLOGÍA ACADEMIA SGI"], ["tiso", "ISO 31010:2019"], ["tcomp", "COMPLEMENTARIO"]], "tipo": "Buena práctica", "trazabilidad": "FODA y PESTEL son técnicas de uso común; no son requisito de ISO 9001. ISO 31010 recoge técnicas de evaluación (por verificar). Numerales y edición por verificar contra el texto oficial. Contenido original de Academia SGI.", "texto": "FODA ordena fortalezas y debilidades (internas) y oportunidades y amenazas (externas). PESTEL explora el entorno político, económico, social, tecnológico, ambiental y legal.\n\nSon ayudas, no obligaciones: la organización elige la técnica que le sirva. Lo importante es que el resultado alimente objetivos y riesgos. Ejemplo (industria): PESTEL revela un cambio legal ambiental que obliga a modificar un proceso."}], "preguntas": [{"id": "m03q1", "tipo": "mc", "nivel": "Intermedio", "texto": "¿Cuál es un factor de contexto EXTERNO?", "opciones": ["Cultura organizacional", "Cambio regulatorio del sector", "Competencia del personal", "Procesos internos"], "correcta": 1, "fuente": "ISO 9001:2015 / ISO 31000:2018", "competencia": "Análisis de contexto", "remedial": "Estudiar Módulo 3, tema 1"}, {"id": "m03q2", "tipo": "vf", "nivel": "Intermedio", "texto": "Todas las expectativas de todas las partes interesadas deben tratarse como requisitos.", "opciones": ["Verdadero", "Falso"], "correcta": 1, "fuente": "ISO 9001:2015 (solo las pertinentes)", "competencia": "Partes interesadas", "remedial": "Estudiar Módulo 3, tema 2"}, {"id": "m03q3", "tipo": "mc", "nivel": "Básico", "texto": "¿Cuál es un factor interno?", "opciones": ["Nueva ley", "Cultura de la organización", "Tipo de cambio", "Competencia"], "correcta": 1, "fuente": "ISO 9001:2015", "competencia": "Análisis de contexto", "remedial": "Estudiar Módulo 3, tema 1"}, {"id": "m03q4", "tipo": "vf", "nivel": "Avanzado", "texto": "ISO 9001 exige emplear FODA para analizar el contexto.", "opciones": ["Verdadero", "Falso"], "correcta": 1, "fuente": "ISO 9001:2015", "competencia": "Análisis de contexto", "remedial": "Estudiar Módulo 3, tema 3"}, {"id": "m03q5", "tipo": "mc", "nivel": "Profesional", "texto": "Un cliente exige entregas en 24 h y la empresa solo cumple en 72 h. ¿Qué implica?", "opciones": ["Una brecha entre expectativa y capacidad que debe analizarse como riesgo", "Nada", "Cambiar al cliente", "Eliminar el objetivo"], "correcta": 0, "fuente": "ISO 9001:2015 / ISO 31000:2018", "competencia": "Partes interesadas", "remedial": "Estudiar Módulo 3, tema 2"}, {"id": "m03q6", "tipo": "mc", "nivel": "Profesional", "texto": "PESTEL sirve principalmente para analizar:", "opciones": ["El entorno externo", "El clima laboral", "Los costos internos", "La auditoría"], "correcta": 0, "fuente": "Buena práctica", "competencia": "Análisis de contexto", "remedial": "Estudiar Módulo 3, tema 3"}], "intro": "El contexto determina qué riesgos importan y a quién. Aquí se aprende a analizar factores internos y externos y a identificar partes interesadas pertinentes.", "objetivos": ["Distinguir factores internos y externos.", "Identificar partes interesadas pertinentes.", "Vincular contexto, objetivos y riesgos."], "competencias": ["Análisis de contexto"], "casos": [{"titulo": "Caso: Distribuidora Sur", "texto": "Una distribuidora ficticia depende de un solo transportista y de un puerto con huelgas frecuentes. Clasifica los factores como internos o externos y vincúlalos a objetivos de entrega."}], "ejercicios": [{"titulo": "Ejercicio", "texto": "Clasifica: huelga portuaria, rotación de personal, nueva ley arancelaria, sistema de inventarios obsoleto.", "orientacion": "Externos: huelga portuaria, ley arancelaria. Internos: rotación de personal, sistema de inventarios."}], "actividad": "Elabora un FODA breve de un proceso de tu organización y marca qué factores afectan sus objetivos.", "resumen": "El contexto reúne factores internos y externos pertinentes. Las partes interesadas se identifican por su pertinencia. FODA y PESTEL son técnicas de ayuda, no obligaciones.", "glosario": [["Contexto", "Factores internos y externos que afectan los resultados."], ["Parte interesada", "Quien afecta o es afectado por las decisiones."], ["FODA", "Técnica de fortalezas, oportunidades, debilidades y amenazas."], ["PESTEL", "Análisis del entorno político, económico, social, tecnológico, ambiental y legal."]], "bibliografia": ["ISO 31000:2018. Gestión del riesgo. Directrices.", "ISO 31010:2019. Gestión del riesgo. Técnicas de evaluación del riesgo.", "COSO (2017). Enterprise Risk Management: Integrating with Strategy and Performance.", "ISO 9001:2015. Sistemas de gestión de la calidad. Requisitos.", "ISO 19011:2018. Directrices para la auditoría de los sistemas de gestión."]}, {"id": "m04", "titulo": "Módulo 4. Identificación de riesgos", "temas": [{"id": "m04t1", "titulo": "Qué es un riesgo y cómo se describe", "tags": [["t31000", "ISO 31000:2018"]], "tipo": "Directriz", "trazabilidad": "ISO 31000:2018 define el riesgo como el efecto de la incertidumbre sobre los objetivos. Numerales por verificar. Contenido original de Academia SGI.", "texto": "Un riesgo puede tener efectos negativos, positivos o ambos. Una descripción útil tiene tres partes: causa, evento y consecuencia. Ejemplo: «Por falta de verificación de antecedentes (causa), un intermediario podría ofrecer pagos indebidos (evento), con sanciones y daño reputacional (consecuencia)».\n\nErrores comunes: describir el riesgo como ausencia de control, o confundirlo con un incidente que ya ocurrió."}, {"id": "m04t2", "titulo": "Técnicas de identificación", "tags": [["t31000", "ISO 31000:2018"], ["tcomp", "COMPLEMENTARIO"]], "tipo": "Buena práctica", "trazabilidad": "ISO 31000:2018 pide identificar riesgos; las técnicas se detallan en ISO 31010 (complementaria). Numerales por verificar. Contenido original de Academia SGI.", "texto": "Lluvia de ideas, entrevistas, análisis de procesos, listas de verificación, revisión de incidentes pasados y análisis de escenarios. Conviene combinar técnicas y usar personas de distintas áreas.\n\nEjemplo (transporte): revisar quejas de clientes y bitácoras de mantenimiento revela riesgos que una lluvia de ideas no mostró."}, {"id": "m04t3", "titulo": "Errores comunes y registro de riesgos", "tags": [["t31000", "ISO 31000:2018"], ["tprop", "METODOLOGÍA ACADEMIA SGI"]], "tipo": "Buena práctica / Metodología", "trazabilidad": "ISO 31000:2018 pide registrar los riesgos; la estructura del registro es metodología propia. Numerales y edición por verificar contra el texto oficial. Contenido original de Academia SGI.", "texto": "Errores frecuentes: definir el riesgo como falta de control («no hay procedimiento»), describir un incidente ya ocurrido, mezclar varios riesgos en uno y omitir al responsable.\n\nUn registro útil lleva identificador, descripción (causa-evento-consecuencia), proceso, responsable y fecha de revisión. Ejemplo (educación): «Por falta de respaldo (causa), podría perderse el registro de notas (evento), con afectación a estudiantes y sanciones (consecuencia)»."}], "preguntas": [{"id": "m04q1", "tipo": "mc", "nivel": "Intermedio", "texto": "¿Qué estructura tiene una buena descripción de riesgo?", "opciones": ["Solo el evento", "Causa, evento y consecuencia", "Solo la consecuencia", "El control existente"], "correcta": 1, "fuente": "ISO 31000:2018 / Metodología Academia SGI", "competencia": "Identificación de riesgos", "remedial": "Estudiar Módulo 4, tema 1"}, {"id": "m04q2", "tipo": "vf", "nivel": "Intermedio", "texto": "Un incidente ya ocurrido es un riesgo.", "opciones": ["Verdadero", "Falso"], "correcta": 1, "fuente": "ISO 31000:2018", "competencia": "Identificación de riesgos", "remedial": "Estudiar Módulo 4, tema 1"}, {"id": "m04q3", "tipo": "mc", "nivel": "Básico", "texto": "Un riesgo bien descrito incluye:", "opciones": ["Solo la consecuencia", "Causa, evento y consecuencia", "Solo el control", "Solo el responsable"], "correcta": 1, "fuente": "Metodología Academia SGI", "competencia": "Identificación de riesgos", "remedial": "Estudiar Módulo 4, tema 1"}, {"id": "m04q4", "tipo": "vf", "nivel": "Avanzado", "texto": "«No hay procedimiento» es una buena descripción de riesgo.", "opciones": ["Verdadero", "Falso"], "correcta": 1, "fuente": "Metodología Academia SGI", "competencia": "Identificación de riesgos", "remedial": "Estudiar Módulo 4, tema 3"}, {"id": "m04q5", "tipo": "mc", "nivel": "Profesional", "texto": "¿Qué combina mejor técnicas de identificación?", "opciones": ["Una sola lluvia de ideas", "Entrevistas, análisis de procesos e historial de incidentes", "Solo encuestas", "Ninguna"], "correcta": 1, "fuente": "ISO 31010:2019 (por verificar)", "competencia": "Identificación de riesgos", "remedial": "Estudiar Módulo 4, tema 2"}, {"id": "m04q6", "tipo": "mc", "nivel": "Profesional", "texto": "«Hubo un robo ayer» es:", "opciones": ["Un riesgo", "Un incidente ya ocurrido", "Un control", "Un objetivo"], "correcta": 1, "fuente": "ISO 31000:2018", "competencia": "Identificación de riesgos", "remedial": "Estudiar Módulo 4, tema 1"}], "intro": "Un riesgo no identificado no puede gestionarse. Este módulo enseña a describir riesgos con claridad y a usar técnicas que no dependan de una sola mirada.", "objetivos": ["Redactar riesgos con causa, evento y consecuencia.", "Elegir técnicas de identificación.", "Evitar errores comunes de redacción."], "competencias": ["Identificación de riesgos"], "casos": [{"titulo": "Caso: Colegio San Martín", "texto": "Un colegio ficticio registra riesgos como «no hay protocolo de evacuación». Reescríbelo con causa, evento y consecuencia, y propón quién debería ser responsable."}], "ejercicios": [{"titulo": "Ejercicio", "texto": "Reescribe correctamente: «No hay control de acceso al archivo».", "orientacion": "Ejemplo: Por ausencia de control de acceso (causa), alguien podría alterar expedientes (evento), con pérdida de integridad y sanciones (consecuencia)."}], "actividad": "Identifica cinco riesgos de un proceso tuyo y regístralos con causa, evento y consecuencia en la herramienta de riesgos.", "resumen": "Los riesgos se describen con causa, evento y consecuencia. Las técnicas se combinan para ampliar la mirada. Evitar describir riesgos como ausencia de control.", "glosario": [["Causa", "Origen o factor que puede provocar el evento."], ["Evento", "Ocurrencia concreta que afecta los objetivos."], ["Consecuencia", "Resultado del evento sobre los objetivos."], ["Registro de riesgos", "Documento que recoge riesgos y su información clave."]], "bibliografia": ["ISO 31000:2018. Gestión del riesgo. Directrices.", "ISO 31010:2019. Gestión del riesgo. Técnicas de evaluación del riesgo.", "COSO (2017). Enterprise Risk Management: Integrating with Strategy and Performance.", "ISO 9001:2015. Sistemas de gestión de la calidad. Requisitos.", "ISO 19011:2018. Directrices para la auditoría de los sistemas de gestión."]}, {"id": "m05", "titulo": "Módulo 5. Análisis y evaluación de riesgos", "temas": [{"id": "m05t1", "titulo": "Análisis: probabilidad e impacto", "tags": [["t31000", "ISO 31000:2018"], ["tprop", "METODOLOGÍA ACADEMIA SGI"]], "tipo": "Directriz / Metodología", "trazabilidad": "ISO 31000:2018 (análisis del riesgo). La matriz 5×5 es metodología configurable propia, no un requisito de ISO 31000 ni de COSO. Numerales por verificar. Contenido original de Academia SGI.", "texto": "Analizar es comprender la naturaleza del riesgo y estimar su nivel. En la matriz 5×5 el nivel = probabilidad × impacto, con escalas de 1 a 5 que cada organización debe definir con criterios propios (por ejemplo, impacto en dinero, seguridad, reputación).\n\nEjemplo (finanzas): impacto 4 = pérdida entre 1 % y 3 % del resultado anual, según los criterios definidos."}, {"id": "m05t2", "titulo": "Evaluación y priorización", "tags": [["t31000", "ISO 31000:2018"], ["tcoso", "COSO ERM 2017"]], "tipo": "Directriz / Componente", "trazabilidad": "ISO 31000:2018 (evaluación del riesgo) y COSO ERM, componente Desempeño. Numerales por verificar. Contenido original de Academia SGI.", "texto": "Evaluar es comparar el nivel del riesgo con los criterios para decidir qué hacer: no hacer nada más, considerar opciones de tratamiento, o revisar objetivos. Se prioriza por nivel, pero también por velocidad, interdependencias y cercanía a la tolerancia."}, {"id": "m05t3", "titulo": "Criterios y consistencia de escalas", "tags": [["t31000", "ISO 31000:2018"], ["tprop", "METODOLOGÍA ACADEMIA SGI"]], "tipo": "Directriz / Metodología", "trazabilidad": "ISO 31000:2018 pide definir criterios de riesgo; las escalas 1-5 son metodología propia. Numerales y edición por verificar contra el texto oficial. Contenido original de Academia SGI.", "texto": "Los criterios definen cómo se mide el impacto (dinero, seguridad, reputación) y la probabilidad (frecuencia o porcentaje). Sin criterios documentados, dos personas calificarán el mismo riesgo de forma distinta.\n\nConviene calibrar con ejemplos y revisar los valores en grupo. Ejemplo (salud): impacto 5 = daño grave a un paciente; impacto 3 = retraso que no causa daño."}], "preguntas": [{"id": "m05q1", "tipo": "vf", "nivel": "Intermedio", "texto": "ISO 31000 exige usar una matriz 5×5.", "opciones": ["Verdadero", "Falso"], "correcta": 1, "fuente": "ISO 31000:2018", "competencia": "Análisis de riesgos", "remedial": "Estudiar Módulo 5, tema 1"}, {"id": "m05q2", "tipo": "mc", "nivel": "Intermedio", "texto": "Un riesgo con probabilidad 4 e impacto 5 tiene, en una matriz 5×5 multiplicativa, nivel:", "opciones": ["9", "20", "25", "10"], "correcta": 1, "fuente": "Metodología Academia SGI", "competencia": "Análisis de riesgos", "remedial": "Estudiar Módulo 5, tema 1"}, {"id": "m05q3", "tipo": "mc", "nivel": "Básico", "texto": "Evaluar un riesgo es:", "opciones": ["Compararlo con los criterios", "Ignorarlo", "Registrar su nombre", "Auditarlo"], "correcta": 0, "fuente": "ISO 31000:2018", "competencia": "Análisis de riesgos", "remedial": "Estudiar Módulo 5, tema 2"}, {"id": "m05q4", "tipo": "mc", "nivel": "Avanzado", "texto": "Probabilidad 3 e impacto 4 en la matriz multiplicativa da:", "opciones": ["7", "12", "15", "20"], "correcta": 1, "fuente": "Metodología Academia SGI", "competencia": "Análisis de riesgos", "remedial": "Estudiar Módulo 5, tema 1"}, {"id": "m05q5", "tipo": "mc", "nivel": "Profesional", "texto": "Dos analistas califican el mismo riesgo con 2 y 5. La causa más probable es:", "opciones": ["Criterios no documentados ni calibrados", "Mala suerte", "Exceso de controles", "Falta de auditor"], "correcta": 0, "fuente": "ISO 31000:2018", "competencia": "Análisis de riesgos", "remedial": "Estudiar Módulo 5, tema 3"}, {"id": "m05q6", "tipo": "vf", "nivel": "Profesional", "texto": "Priorizar solo por el número de la matriz es siempre suficiente.", "opciones": ["Verdadero", "Falso"], "correcta": 1, "fuente": "ISO 31000:2018", "competencia": "Evaluación y priorización", "remedial": "Estudiar Módulo 5, tema 2"}], "intro": "Analizar es estimar el nivel de un riesgo; evaluar es compararlo con criterios. Se practica con una escala configurable, sin confundirla con un requisito de ninguna norma.", "objetivos": ["Estimar probabilidad e impacto con criterios.", "Calcular niveles en una matriz 5×5.", "Priorizar con juicio, no solo con números."], "competencias": ["Análisis de riesgos"], "casos": [{"titulo": "Caso: Aseguradora Horizonte", "texto": "Dos analistas de una aseguradora ficticia califican el mismo riesgo con 2 y 5. Explica por qué ocurre y cómo calibrarlos."}], "ejercicios": [{"titulo": "Ejercicio", "texto": "Probabilidad 3 e impacto 4: ¿qué nivel y qué categoría (≥15 alto, ≥8 medio, resto bajo)?", "orientacion": "3×4 = 12, categoría media."}], "actividad": "Define criterios de impacto para tu organización con ejemplos concretos por nivel y regístralos en la herramienta de riesgos.", "resumen": "Analizar estima el nivel; evaluar compara con criterios. La matriz 5×5 es configurable y no es exigida por ISO 31000. Los criterios documentados dan consistencia.", "glosario": [["Probabilidad", "Posibilidad de que ocurra el evento."], ["Impacto", "Magnitud de la consecuencia."], ["Criterios de riesgo", "Referencias para evaluar la importancia del riesgo."], ["Evaluación", "Comparación del nivel de riesgo con los criterios."]], "bibliografia": ["ISO 31000:2018. Gestión del riesgo. Directrices.", "ISO 31010:2019. Gestión del riesgo. Técnicas de evaluación del riesgo.", "COSO (2017). Enterprise Risk Management: Integrating with Strategy and Performance.", "ISO 9001:2015. Sistemas de gestión de la calidad. Requisitos.", "ISO 19011:2018. Directrices para la auditoría de los sistemas de gestión."]}, {"id": "m06", "titulo": "Módulo 6. Tratamiento de riesgos y evaluación de controles", "temas": [{"id": "m06t1", "titulo": "Opciones de tratamiento", "tags": [["t31000", "ISO 31000:2018"], ["tcoso", "COSO ERM 2017"]], "tipo": "Directriz / Componente", "trazabilidad": "ISO 31000:2018 (tratamiento del riesgo); COSO ERM, respuesta a los riesgos. Numerales por verificar. Contenido original de Academia SGI.", "texto": "Las opciones incluyen evitar el riesgo, asumirlo o aumentarlo para aprovechar una oportunidad, eliminar la fuente, modificar la probabilidad o las consecuencias, compartirlo (seguros, contratos) y retenerlo con decisión informada. El tratamiento puede generar nuevos riesgos que también deben evaluarse.\n\nEjemplo (industria): subcontratar un proceso peligroso comparte el riesgo, pero crea riesgo de dependencia del proveedor."}, {"id": "m06t2", "titulo": "Controles: diseño y funcionamiento", "tags": [["tprop", "METODOLOGÍA ACADEMIA SGI"], ["tcomp", "COMPLEMENTARIO"]], "tipo": "Buena práctica", "trazabilidad": "Clasificación de controles: buena práctica y metodología propia. Numerales por verificar. Contenido original de Academia SGI.", "texto": "Un control se evalúa en dos planos: diseño (¿si funciona, mitiga la causa?) y funcionamiento (¿se ejecuta, con la frecuencia y evidencia previstas?). Puede ser preventivo, detectivo o correctivo, manual o automático. Un control bien diseñado que no se ejecuta no reduce el riesgo."}, {"id": "m06t3", "titulo": "Evidencia sobre eficacia de controles", "tags": [["tprop", "METODOLOGÍA ACADEMIA SGI"], ["t19011", "ISO 19011:2018"]], "tipo": "Buena práctica / Metodología", "trazabilidad": "La eficacia se evalúa con técnicas de verificación de uso común; ISO 19011:2018 orienta sobre evidencia de auditoría (directriz). Numerales y edición por verificar contra el texto oficial. Contenido original de Academia SGI.", "texto": "Para saber si un control funciona se contrasta la evidencia: observar la ejecución, reejecutar una muestra, revisar registros y entrevistar. Un control sin evidencia de ejecución debe considerarse no demostrado.\n\nEjemplo (finanzas): la «doble firma» se prueba revisando una muestra de pagos y verificando que ambas firmas existen y son de personas distintas."}], "preguntas": [{"id": "m06q1", "tipo": "mc", "nivel": "Intermedio", "texto": "Un control bien diseñado que nunca se ejecuta es:", "opciones": ["Eficaz", "Ineficaz en funcionamiento", "Un riesgo residual cero", "Un control correctivo"], "correcta": 1, "fuente": "Metodología Academia SGI", "competencia": "Evaluación de controles", "remedial": "Estudiar Módulo 6, tema 2"}, {"id": "m06q2", "tipo": "vf", "nivel": "Intermedio", "texto": "Tratar un riesgo nunca puede generar nuevos riesgos.", "opciones": ["Verdadero", "Falso"], "correcta": 1, "fuente": "ISO 31000:2018", "competencia": "Tratamiento de riesgos", "remedial": "Estudiar Módulo 6, tema 1"}, {"id": "m06q3", "tipo": "mc", "nivel": "Básico", "texto": "Compartir un riesgo puede lograrse mediante:", "opciones": ["Seguros o contratos", "Ignorarlo", "Eliminar registros", "Cambiar el objetivo"], "correcta": 0, "fuente": "ISO 31000:2018", "competencia": "Tratamiento de riesgos", "remedial": "Estudiar Módulo 6, tema 1"}, {"id": "m06q4", "tipo": "vf", "nivel": "Avanzado", "texto": "Un control sin registros de ejecución puede contarse como eficaz.", "opciones": ["Verdadero", "Falso"], "correcta": 1, "fuente": "Metodología Academia SGI", "competencia": "Evaluación de controles", "remedial": "Estudiar Módulo 6, tema 3"}, {"id": "m06q5", "tipo": "mc", "nivel": "Profesional", "texto": "Un control bien diseñado pero ejecutado de forma irregular implica:", "opciones": ["Diseño adecuado y funcionamiento deficiente", "Eficacia plena", "Riesgo cero", "Control correctivo"], "correcta": 0, "fuente": "Metodología Academia SGI", "competencia": "Evaluación de controles", "remedial": "Estudiar Módulo 6, tema 2"}, {"id": "m06q6", "tipo": "mc", "nivel": "Profesional", "texto": "Para probar una doble firma se debe:", "opciones": ["Revisar una muestra de pagos y verificar ambas firmas", "Preguntar al gerente", "Leer el manual", "Nada"], "correcta": 0, "fuente": "Buena práctica", "competencia": "Evaluación de controles", "remedial": "Estudiar Módulo 6, tema 3"}], "intro": "El tratamiento decide qué hacer con el riesgo; los controles son parte de esa respuesta. Un control vale por su funcionamiento, no por su existencia en papel.", "objetivos": ["Elegir opciones de tratamiento.", "Evaluar diseño y funcionamiento de controles.", "Reconocer controles que solo existen en papel."], "competencias": ["Evaluación de controles"], "casos": [{"titulo": "Caso: Industrias Delta", "texto": "Una planta ficticia declara un control de inspección diaria, pero no hay registros de los últimos tres meses. Evalúa diseño y funcionamiento, y recomienda el siguiente paso."}], "ejercicios": [{"titulo": "Ejercicio", "texto": "Un control está bien diseñado pero no se ejecuta. ¿Cómo se evalúa y qué impacto tiene en el riesgo residual?", "orientacion": "Diseño adecuado, funcionamiento ineficaz; el riesgo residual no puede reducirse hasta demostrar su ejecución."}], "actividad": "Selecciona un control de tu organización y define qué evidencia demostraría que funciona.", "resumen": "El tratamiento puede evitar, reducir, compartir o retener. Un control se evalúa por diseño y funcionamiento, con evidencia. Un control sin ejecución no reduce el riesgo.", "glosario": [["Control", "Medida que modifica el riesgo."], ["Diseño", "Capacidad del control, si se ejecuta, de mitigar la causa."], ["Funcionamiento", "Ejecución real del control."], ["Evidencia", "Registro u observación que demuestra la ejecución."]], "bibliografia": ["ISO 31000:2018. Gestión del riesgo. Directrices.", "ISO 31010:2019. Gestión del riesgo. Técnicas de evaluación del riesgo.", "COSO (2017). Enterprise Risk Management: Integrating with Strategy and Performance.", "ISO 9001:2015. Sistemas de gestión de la calidad. Requisitos.", "ISO 19011:2018. Directrices para la auditoría de los sistemas de gestión."]}, {"id": "m07", "titulo": "Módulo 7. Riesgos inherentes, residuales, apetito y tolerancia", "temas": [{"id": "m07t1", "titulo": "Inherente y residual", "tags": [["t31000", "ISO 31000:2018"], ["tprop", "METODOLOGÍA ACADEMIA SGI"]], "tipo": "Directriz / Metodología", "trazabilidad": "Los términos inherente y residual son de uso común; el cálculo es metodología propia. Numerales por verificar. Contenido original de Academia SGI.", "texto": "Riesgo inherente: nivel sin considerar controles. Riesgo residual: nivel que permanece después de considerar los controles y su eficacia. Residual = probabilidad residual × impacto residual, y cada valor debe justificarse con evidencia del control.\n\nError frecuente: reducir el residual por controles que solo existen en papel."}, {"id": "m07t2", "titulo": "Apetito y tolerancia", "tags": [["tcoso", "COSO ERM 2017"]], "tipo": "Componente metodológico", "trazabilidad": "COSO ERM 2017: apetito de riesgo y tolerancia en Estrategia y objetivos. Numerales por verificar. Contenido original de Academia SGI.", "texto": "El apetito es la cantidad y tipo de riesgo que la organización está dispuesta a asumir al perseguir valor. La tolerancia es la variación aceptable respecto a un objetivo. Ejemplo (servicios financieros): apetito bajo a fraude, tolerancia de pérdidas operativas hasta un monto definido por la dirección.\n\nNo son lo mismo ni son requisitos de ISO."}, {"id": "m07t3", "titulo": "De lo inherente a lo aceptable", "tags": [["tprop", "METODOLOGÍA ACADEMIA SGI"], ["tcoso", "COSO ERM 2017"]], "tipo": "Metodología / Componente", "trazabilidad": "Cálculo propio de Academia SGI y conceptos de COSO ERM 2017 (apetito y tolerancia). Numerales y edición por verificar contra el texto oficial. Contenido original de Academia SGI.", "texto": "El flujo es: nivel inherente, efecto de los controles, nivel residual y comparación con la tolerancia definida por la dirección. Si el residual la supera, se requiere tratamiento adicional o una decisión informada y documentada.\n\nEjemplo (servicios financieros): fraude con residual 12 y tolerancia 8: se refuerzan controles o la dirección acepta formalmente con plazo de revisión."}], "preguntas": [{"id": "m07q1", "tipo": "mc", "nivel": "Intermedio", "texto": "El riesgo residual es:", "opciones": ["El riesgo sin controles", "El que permanece tras considerar controles y su eficacia", "Siempre cero", "El apetito de riesgo"], "correcta": 1, "fuente": "Metodología Academia SGI", "competencia": "Riesgo inherente y residual", "remedial": "Estudiar Módulo 7, tema 1"}, {"id": "m07q2", "tipo": "vf", "nivel": "Intermedio", "texto": "Apetito y tolerancia al riesgo significan lo mismo en COSO ERM.", "opciones": ["Verdadero", "Falso"], "correcta": 1, "fuente": "COSO ERM 2017", "competencia": "Apetito y tolerancia", "remedial": "Estudiar Módulo 7, tema 2"}, {"id": "m07q3", "tipo": "mc", "nivel": "Básico", "texto": "El residual se calcula:", "opciones": ["Tras considerar los controles", "Sin controles", "Con el apetito", "Con el presupuesto"], "correcta": 0, "fuente": "Metodología Academia SGI", "competencia": "Riesgo inherente y residual", "remedial": "Estudiar Módulo 7, tema 1"}, {"id": "m07q4", "tipo": "mc", "nivel": "Avanzado", "texto": "Probabilidad 2 e impacto 5 da residual:", "opciones": ["7", "10", "12", "25"], "correcta": 1, "fuente": "Metodología Academia SGI", "competencia": "Riesgo inherente y residual", "remedial": "Estudiar Módulo 7, tema 1"}, {"id": "m07q5", "tipo": "mc", "nivel": "Profesional", "texto": "Un residual de 5 sin pruebas de los controles es:", "opciones": ["Poco fiable", "Definitivo", "Cero", "Aceptable siempre"], "correcta": 0, "fuente": "Metodología Academia SGI", "competencia": "Riesgo inherente y residual", "remedial": "Estudiar Módulo 7, tema 3"}, {"id": "m07q6", "tipo": "mc", "nivel": "Profesional", "texto": "Si el residual supera la tolerancia, corresponde:", "opciones": ["Tratamiento adicional o decisión informada documentada", "Ocultarlo", "Subir la tolerancia sin criterio", "Nada"], "correcta": 0, "fuente": "COSO ERM 2017", "competencia": "Apetito y tolerancia", "remedial": "Estudiar Módulo 7, tema 3"}], "intro": "Inherente, residual, apetito y tolerancia son conceptos que se confunden con facilidad. Este módulo los separa y los conecta en una decisión de riesgo.", "objetivos": ["Calcular riesgo inherente y residual.", "Diferenciar apetito y tolerancia.", "Decidir si un residual es aceptable."], "competencias": ["Riesgo inherente y residual"], "casos": [{"titulo": "Caso: Banco Costa Azul", "texto": "Un banco ficticio reporta fraude inherente 20 y residual 5, sin pruebas de sus controles. Cuestiona la fiabilidad del residual y propón verificaciones."}], "ejercicios": [{"titulo": "Ejercicio", "texto": "Probabilidad inherente 4, impacto 5; con controles 2 y 5. Calcula inherente y residual.", "orientacion": "Inherente 20; residual 10."}], "actividad": "Elige un riesgo registrado, calcula inherente y residual, justifica los valores y compara con la tolerancia definida.", "resumen": "El residual se calcula tras considerar controles con evidencia. El apetito expresa la disposición a asumir riesgo; la tolerancia, la variación aceptable. Si el residual excede la tolerancia hay que decidir.", "glosario": [["Inherente", "Nivel sin considerar controles."], ["Residual", "Nivel tras considerar controles y su eficacia."], ["Apetito", "Cantidad y tipo de riesgo dispuesta a asumir."], ["Tolerancia", "Variación aceptable respecto a un objetivo."]], "bibliografia": ["ISO 31000:2018. Gestión del riesgo. Directrices.", "ISO 31010:2019. Gestión del riesgo. Técnicas de evaluación del riesgo.", "COSO (2017). Enterprise Risk Management: Integrating with Strategy and Performance.", "ISO 9001:2015. Sistemas de gestión de la calidad. Requisitos.", "ISO 19011:2018. Directrices para la auditoría de los sistemas de gestión."]}, {"id": "m08", "titulo": "Módulo 8. Fundamentos de ISO 37001:2025", "temas": [{"id": "m08t1", "titulo": "Qué es y qué no garantiza", "tags": [["t37001", "ISO 37001:2025"]], "tipo": "Requisito", "trazabilidad": "Fuente: ISO 37001 (requisitos certificables). Numerales y cambios de la edición 2025 por verificar contra el texto oficial. Contenido original de Academia SGI; no constituye asesoría legal.", "texto": "ISO 37001 establece requisitos para implementar, mantener y mejorar un sistema de gestión antisoborno, aplicable a organizaciones de cualquier tamaño y sector. Exige medidas razonables y proporcionales al riesgo.\n\nNo garantiza que nunca ocurra un soborno: reduce la probabilidad y mejora la capacidad de prevenir, detectar y responder."}, {"id": "m08t2", "titulo": "Integración con otros sistemas", "tags": [["t37001", "ISO 37001:2025"], ["t9001", "ISO 9001:2015"], ["tcomp", "COMPLEMENTARIO"]], "tipo": "Buena práctica", "trazabilidad": "Fuente: ISO 37001 e ISO 9001:2015 (estructura de alto nivel común, por verificar). Numerales y cambios de la edición 2025 por verificar contra el texto oficial. Contenido original de Academia SGI; no constituye asesoría legal.", "texto": "Las normas ISO de sistemas de gestión comparten una estructura común, lo que facilita integrar documentación, auditorías internas y revisión por la dirección. Cada norma conserva requisitos propios: el soborno exige controles específicos que ISO 9001 no contempla."}, {"id": "m08t3", "titulo": "Qué cambió en la edición 2025", "tags": [["t37001", "ISO 37001:2025"], ["tiso", "ISO 37301:2021 (complementaria)"], ["tcomp", "COMPLEMENTARIO"]], "tipo": "Requisito (edición)", "trazabilidad": "Fuentes secundarias (organismos de certificación y firmas legales) sobre la edición 2025; contrastar con el texto oficial de ISO. Publicada en febrero de 2025 según estas fuentes. Numerales por verificar contra el texto oficial. Contenido original de Academia SGI.", "texto": "Según fuentes secundarias, la edición 2025 armoniza la redacción con otras normas de gestión; formaliza el concepto de cultura antisoborno; sustituye la «función antisoborno» por «función antisoborno», con responsabilidades e independencia más claras; añade la planificación de los cambios; detalla la gestión de conflictos de intereses; e incorpora el cambio climático como cuestión a considerar (Enmienda 1:2024).\n\nLa organización certificada con la edición 2016 debe migrar en un plazo de transición. Consulta fechas y condiciones con tu organismo de certificación."}], "preguntas": [{"id": "m08q1", "tipo": "vf", "nivel": "Intermedio", "texto": "Un sistema ISO 37001 certificado garantiza que no habrá sobornos.", "opciones": ["Verdadero", "Falso"], "correcta": 1, "fuente": "ISO 37001", "competencia": "Fundamentos antisoborno", "remedial": "Estudiar Módulo 8, tema 1"}, {"id": "m08q2", "tipo": "mc", "nivel": "Intermedio", "texto": "Integrar ISO 37001 con ISO 9001 permite:", "opciones": ["Fusionar sus requisitos", "Compartir elementos comunes conservando requisitos propios", "Eliminar la evaluación de riesgos de soborno", "Certificarse en ambas con un solo auditor siempre"], "correcta": 1, "fuente": "Buena práctica", "competencia": "Integración de sistemas", "remedial": "Estudiar Módulo 8, tema 2"}, {"id": "m08q3", "tipo": "mc", "nivel": "Básico", "texto": "ISO 37001:2025 reemplaza a:", "opciones": ["La edición 2016", "ISO 9001", "ISO 31000", "ISO 19011"], "correcta": 0, "fuente": "ISO 37001:2025 (por verificar)", "competencia": "Fundamentos antisoborno", "remedial": "Estudiar Módulo 8, tema 3"}, {"id": "m08q4", "tipo": "mc", "nivel": "Avanzado", "texto": "¿Qué término sustituyó la edición 2025, según fuentes secundarias?", "opciones": ["Función antisoborno por función antisoborno", "Función antisoborno por función antisoborno", "Política por norma", "Auditoría por revisión"], "correcta": 1, "fuente": "ISO 37001:2025 (por verificar)", "competencia": "Fundamentos antisoborno", "remedial": "Estudiar Módulo 8, tema 3"}, {"id": "m08q5", "tipo": "mc", "nivel": "Profesional", "texto": "Una empresa solo cambia el año en sus documentos. ¿Qué falla?", "opciones": ["Se omite revisar cultura, función, conflictos y cambios", "Nada", "Se pierde la política", "Falta un auditor externo"], "correcta": 0, "fuente": "ISO 37001:2025 (por verificar)", "competencia": "Fundamentos antisoborno", "remedial": "Estudiar Módulo 8, tema 3"}, {"id": "m08q6", "tipo": "vf", "nivel": "Profesional", "texto": "Un cambio de la norma implica automáticamente que la organización ya cambió su operación.", "opciones": ["Verdadero", "Falso"], "correcta": 1, "fuente": "ISO 37001:2025 (por verificar)", "competencia": "Fundamentos antisoborno", "remedial": "Estudiar Módulo 8, tema 3"}], "intro": "La edición 2025 de ISO 37001 reemplaza a la de 2016. Este módulo fija qué es el sistema antisoborno y qué cambió, sin dar por cierto lo que aún debes verificar.", "objetivos": ["Explicar qué exige y qué no garantiza ISO 37001.", "Identificar los principales cambios de la edición 2025.", "Distinguir cambio de la norma y cambio operativo."], "competencias": ["Fundamentos antisoborno"], "casos": [{"titulo": "Caso: Manufacturas Aurora", "texto": "Una empresa ficticia certificada con la edición 2016 cree que basta cambiar el año en sus documentos. Explica qué debería revisar y por qué un cambio de la norma no es lo mismo que un cambio operativo."}], "ejercicios": [{"titulo": "Ejercicio", "texto": "Clasifica como cambio de la norma o cambio operativo: nueva cláusula de cultura; capacitar a gerentes sobre conflictos de intereses.", "orientacion": "Norma: nueva exigencia. Operativo: lo que la organización hace para cumplirla."}], "actividad": "Haz una lista de cinco elementos de tu sistema que deberías revisar por la edición 2025 (cultura, función, conflictos, cambios, clima).", "resumen": "La edición 2025 sustituye a la de 2016. Se destacan cultura antisoborno, función antisoborno, planificación de cambios, conflictos de intereses y cambio climático. Los detalles se contrastan con la norma oficial.", "glosario": [["Sistema antisoborno", "Sistema de gestión para prevenir, detectar y abordar el soborno."], ["Cultura antisoborno", "Valores y conductas que sostienen la integridad."], ["Transición", "Período para migrar de una edición a otra."], ["Enmienda", "Cambio formal a una norma, como la 1:2024 de clima."]], "bibliografia": ["ISO 37001:2025. Sistemas de gestión antisoborno. Requisitos con orientación para su uso.", "ISO 37301:2021. Sistemas de gestión de compliance. Requisitos con orientación.", "ISO/TS 37008 (edición vigente, por verificar). Investigaciones internas en organizaciones.", "ISO 31000:2018. Gestión del riesgo. Directrices.", "ISO 19011:2018. Directrices para la auditoría de los sistemas de gestión."]}, {"id": "m09", "titulo": "Módulo 9. Contexto, liderazgo y gobierno del sistema antisoborno", "temas": [{"id": "m09t1", "titulo": "Órgano de gobierno y alta dirección", "tags": [["t37001", "ISO 37001:2025"]], "tipo": "Requisito", "trazabilidad": "Fuente: ISO 37001 (liderazgo). Numerales y cambios de la edición 2025 por verificar contra el texto oficial. Contenido original de Academia SGI; no constituye asesoría legal.", "texto": "El órgano de gobierno aprueba la política antisoborno y supervisa el sistema; la alta dirección lo implementa, asigna recursos y promueve una cultura de integridad. El liderazgo se demuestra con decisiones y conducta, no solo con declaraciones.\n\nEjemplo (sector público): el director rechaza un atajo en una contratación urgente y deja constancia del motivo."}, {"id": "m09t2", "titulo": "Función antisoborno", "tags": [["t37001", "ISO 37001:2025"], ["tcomp", "COMPLEMENTARIO"]], "tipo": "Requisito / Buena práctica", "trazabilidad": "Fuente: ISO 37001; el diseño concreto de la función es buena práctica. Numerales y cambios de la edición 2025 por verificar contra el texto oficial. Contenido original de Academia SGI; no constituye asesoría legal.", "texto": "Se asigna a una persona o función la supervisión del sistema, con autoridad, independencia y acceso directo al órgano de gobierno. En organizaciones pequeñas puede ser una persona con otras responsabilidades, evitando conflictos de interés."}, {"id": "m09t3", "titulo": "Cultura antisoborno", "tags": [["t37001", "ISO 37001:2025"], ["tprop", "METODOLOGÍA ACADEMIA SGI"]], "tipo": "Requisito / Metodología", "trazabilidad": "Fuentes secundarias (organismos de certificación y firmas legales) sobre la edición 2025; contrastar con el texto oficial de ISO. El indicador y las encuestas son metodología propia. Numerales por verificar contra el texto oficial. Contenido original de Academia SGI.", "texto": "La cultura antisoborno es el conjunto de valores y conductas que hacen que la integridad sea la opción normal. La edición 2025 la destaca como elemento propio.\n\nSe construye con ejemplo de la dirección, mensajes coherentes, decisiones consistentes ante infracciones y canales seguros. Puede observarse con encuestas de percepción, tasa de uso del canal y casos tratados. Ejemplo (sector público): la dirección explica públicamente por qué se rechazó una oferta irregular."}], "preguntas": [{"id": "m09q1", "tipo": "mc", "nivel": "Intermedio", "texto": "La función antisoborno debe tener:", "opciones": ["Autoridad e independencia adecuadas y acceso al órgano de gobierno", "Dependencia exclusiva del área comercial", "Ninguna responsabilidad documentada", "Solo funciones de capacitación"], "correcta": 0, "fuente": "ISO 37001", "competencia": "Gobierno antisoborno", "remedial": "Estudiar Módulo 9, tema 2"}, {"id": "m09q2", "tipo": "vf", "nivel": "Intermedio", "texto": "La política antisoborno puede ser solo una declaración sin respaldo de la dirección.", "opciones": ["Verdadero", "Falso"], "correcta": 1, "fuente": "ISO 37001", "competencia": "Liderazgo", "remedial": "Estudiar Módulo 9, tema 1"}, {"id": "m09q3", "tipo": "mc", "nivel": "Básico", "texto": "¿Quién aprueba la política antisoborno?", "opciones": ["El órgano de gobierno o la alta dirección según la estructura", "Un proveedor", "El cliente", "Nadie"], "correcta": 0, "fuente": "ISO 37001:2025 (por verificar)", "competencia": "Gobierno antisoborno", "remedial": "Estudiar Módulo 9, tema 1"}, {"id": "m09q4", "tipo": "vf", "nivel": "Avanzado", "texto": "La cultura se demuestra solo con declaraciones.", "opciones": ["Verdadero", "Falso"], "correcta": 1, "fuente": "ISO 37001:2025 (por verificar)", "competencia": "Gobierno antisoborno", "remedial": "Estudiar Módulo 9, tema 3"}, {"id": "m09q5", "tipo": "mc", "nivel": "Profesional", "texto": "Una máxima autoridad omite un conflicto de intereses. ¿Qué efecto es probable?", "opciones": ["Debilita la cultura y la credibilidad del sistema", "Ninguno", "Mejora la cultura", "Elimina riesgos"], "correcta": 0, "fuente": "ISO 37001:2025 (por verificar)", "competencia": "Gobierno antisoborno", "remedial": "Estudiar Módulo 9, tema 3"}, {"id": "m09q6", "tipo": "mc", "nivel": "Profesional", "texto": "La independencia de la función antisoborno implica:", "opciones": ["Acceso al órgano de gobierno y ausencia de conflicto en su rol", "Depender del área comercial", "Operar sin recursos", "No reportar"], "correcta": 0, "fuente": "ISO 37001:2025 (por verificar)", "competencia": "Gobierno antisoborno", "remedial": "Estudiar Módulo 9, tema 2"}], "intro": "El liderazgo se prueba en decisiones difíciles. Aquí se estudia el papel del órgano de gobierno, la alta dirección y la función antisoborno, y la cultura que los sostiene.", "objetivos": ["Describir roles del órgano de gobierno y de la alta dirección.", "Explicar la independencia de la función antisoborno.", "Entender la cultura antisoborno como práctica."], "competencias": ["Gobierno antisoborno"], "casos": [{"titulo": "Caso: Municipio de Lomas", "texto": "Un municipio ficticio aprueba una política antisoborno pero el alcalde omite declarar que su familiar licita. Analiza el efecto sobre la cultura y qué debe hacer el órgano de gobierno."}], "ejercicios": [{"titulo": "Ejercicio", "texto": "Propón tres indicadores para observar la cultura antisoborno.", "orientacion": "Percepción en encuestas, uso del canal de denuncia, tiempo de respuesta a casos."}], "actividad": "Aplica una encuesta breve de cinco preguntas sobre integridad en tu área y registra los resultados.", "resumen": "El liderazgo y la función antisoborno sostienen el sistema. La cultura se observa en conductas y decisiones, no en declaraciones.", "glosario": [["Órgano de gobierno", "Grupo con la responsabilidad última de la organización."], ["Alta dirección", "Quienes dirigen y controlan la organización al más alto nivel."], ["Función antisoborno", "Función que supervisa el sistema antisoborno."], ["Cultura", "Valores y conductas compartidas."]], "bibliografia": ["ISO 37001:2025. Sistemas de gestión antisoborno. Requisitos con orientación para su uso.", "ISO 37301:2021. Sistemas de gestión de compliance. Requisitos con orientación.", "ISO/TS 37008 (edición vigente, por verificar). Investigaciones internas en organizaciones.", "ISO 31000:2018. Gestión del riesgo. Directrices.", "ISO 19011:2018. Directrices para la auditoría de los sistemas de gestión."]}, {"id": "m10", "titulo": "Módulo 10. Evaluación de riesgos de soborno", "temas": [{"id": "m10t1", "titulo": "Proceso de evaluación", "tags": [["t37001", "ISO 37001:2025"], ["t31000", "ISO 31000:2018"]], "tipo": "Requisito / Directriz", "trazabilidad": "ISO 37001 exige evaluar riesgos de soborno; usar ISO 31000 como método es opcional (directriz). Numerales y cambios de la edición 2025 por verificar contra el texto oficial. Contenido original de Academia SGI; no constituye asesoría legal.", "texto": "Se identifican los riesgos de soborno razonablemente previsibles, se analizan y se priorizan según criterios definidos. Factores: países y sectores, tipo de transacciones, interacción con funcionarios públicos, uso de terceros e intermediarios, y tamaño de los pagos.\n\nLa evaluación se revisa periódicamente y ante cambios relevantes."}, {"id": "m10t2", "titulo": "Ejemplo en construcción", "tags": [["tprop", "METODOLOGÍA ACADEMIA SGI"], ["t37001", "ISO 37001:2025"]], "tipo": "Caso práctico", "trazabilidad": "Metodología Academia SGI aplicando ISO 37001. Numerales y cambios de la edición 2025 por verificar contra el texto oficial. Contenido original de Academia SGI; no constituye asesoría legal.", "texto": "Una constructora tramita licencias y recibe inspecciones. Riesgo: pago indebido a un inspector para acelerar o evitar observaciones. Causa: discrecionalidad y presión por plazos. Controles: trámites con registro, dos personas en las visitas, pagos solo por canales oficiales y revisión de gastos de gestión."}, {"id": "m10t3", "titulo": "Contexto, partes interesadas y cambio climático", "tags": [["t37001", "ISO 37001:2025"], ["t31000", "ISO 31000:2018"]], "tipo": "Requisito (edición) / Directriz", "trazabilidad": "Fuentes secundarias (organismos de certificación y firmas legales) sobre la edición 2025; contrastar con el texto oficial de ISO. La Enmienda 1:2024 incorporó el cambio climático a las normas de sistemas de gestión. Numerales por verificar contra el texto oficial. Contenido original de Academia SGI.", "texto": "Al determinar el contexto, la organización considera si el cambio climático es una cuestión pertinente y si hay partes interesadas con requisitos relacionados. Esto no crea por sí solo riesgos de soborno, pero puede alterarlos.\n\nEjemplo: tras una inundación se agilizan contrataciones de emergencia y permisos ambientales; la presión del tiempo y la discrecionalidad elevan el riesgo de pagos indebidos."}], "preguntas": [{"id": "m10q1", "tipo": "mc", "nivel": "Intermedio", "texto": "¿Cuál es un factor que eleva el riesgo de soborno?", "opciones": ["Uso de intermediarios con funcionarios públicos", "Tener política escrita", "Auditoría interna", "Capacitación anual"], "correcta": 0, "fuente": "ISO 37001", "competencia": "Evaluación de riesgos de soborno", "remedial": "Estudiar Módulo 10, tema 1"}, {"id": "m10q2", "tipo": "vf", "nivel": "Intermedio", "texto": "ISO 37001 exige emplear ISO 31000 para evaluar los riesgos de soborno.", "opciones": ["Verdadero", "Falso"], "correcta": 1, "fuente": "ISO 37001 / ISO 31000", "competencia": "Evaluación de riesgos de soborno", "remedial": "Estudiar Módulo 10, tema 1"}, {"id": "m10q3", "tipo": "mc", "nivel": "Básico", "texto": "Una evaluación de riesgos de soborno comienza por:", "opciones": ["Contexto y factores de riesgo", "El presupuesto", "Los resultados", "El cierre"], "correcta": 0, "fuente": "ISO 37001:2025 (por verificar)", "competencia": "Evaluación de riesgos de soborno", "remedial": "Estudiar Módulo 10, tema 1"}, {"id": "m10q4", "tipo": "vf", "nivel": "Avanzado", "texto": "El cambio climático crea siempre riesgos de soborno.", "opciones": ["Verdadero", "Falso"], "correcta": 1, "fuente": "ISO 37001:2025 (por verificar)", "competencia": "Evaluación de riesgos de soborno", "remedial": "Estudiar Módulo 10, tema 3"}, {"id": "m10q5", "tipo": "mc", "nivel": "Profesional", "texto": "¿Por qué elevan el riesgo las contrataciones de emergencia?", "opciones": ["Menos tiempo y mayor discrecionalidad", "Más controles", "Menos terceros", "Ninguna"], "correcta": 0, "fuente": "ISO 37001:2025 (por verificar)", "competencia": "Evaluación de riesgos de soborno", "remedial": "Estudiar Módulo 10, tema 3"}, {"id": "m10q6", "tipo": "mc", "nivel": "Profesional", "texto": "La organización debe, respecto al clima:", "opciones": ["Determinar si es pertinente y justificarlo", "Ignorarlo", "Adoptarlo siempre", "Certificarse en clima"], "correcta": 0, "fuente": "ISO 37001:2025 (por verificar)", "competencia": "Evaluación de riesgos de soborno", "remedial": "Estudiar Módulo 10, tema 3"}], "intro": "No se puede gestionar lo que no se ha mirado de frente. La evaluación de riesgos de soborno parte del contexto, que ahora incluye considerar el cambio climático.", "objetivos": ["Aplicar el proceso de evaluación de riesgos de soborno.", "Incorporar el contexto y las partes interesadas.", "Considerar el cambio climático cuando sea pertinente."], "competencias": ["Evaluación de riesgos de soborno"], "casos": [{"titulo": "Caso: Obras Rápidas S.A.", "texto": "Una constructora ficticia atiende reconstrucción tras un desastre con contratos de emergencia. Identifica riesgos de soborno asociados y controles proporcionales."}], "ejercicios": [{"titulo": "Ejercicio", "texto": "Señala dos riesgos de soborno en la contratación de emergencia.", "orientacion": "Discrecionalidad en la selección y pagos para acelerar permisos."}], "actividad": "Revisa la evaluación de riesgos de soborno de tu organización y añade el factor clima si es pertinente, con justificación.", "resumen": "La evaluación identifica, analiza y evalúa riesgos de soborno. El contexto puede incluir el cambio climático cuando es pertinente, y esto debe justificarse.", "glosario": [["Riesgo de soborno", "Posibilidad razonablemente previsible de que ocurra soborno."], ["Contexto", "Factores internos y externos pertinentes."], ["Parte interesada pertinente", "La que afecta o puede ser afectada."], ["Contratación de emergencia", "Compra bajo urgencia con menos controles habituales."]], "bibliografia": ["ISO 37001:2025. Sistemas de gestión antisoborno. Requisitos con orientación para su uso.", "ISO 37301:2021. Sistemas de gestión de compliance. Requisitos con orientación.", "ISO/TS 37008 (edición vigente, por verificar). Investigaciones internas en organizaciones.", "ISO 31000:2018. Gestión del riesgo. Directrices.", "ISO 19011:2018. Directrices para la auditoría de los sistemas de gestión."]}, {"id": "m11", "titulo": "Módulo 11. Debida diligencia", "temas": [{"id": "m11t1", "titulo": "Qué es y cuándo aplicarla", "tags": [["t37001", "ISO 37001:2025"]], "tipo": "Requisito", "trazabilidad": "Fuente: ISO 37001 (debida diligencia proporcional al riesgo). Numerales y cambios de la edición 2025 por verificar contra el texto oficial. Contenido original de Academia SGI; no constituye asesoría legal.", "texto": "Es la evaluación de transacciones, proyectos, socios de negocio y personal cuando el riesgo de soborno lo justifica. Debe ser proporcional: más profunda cuando el riesgo es alto y más sencilla cuando es bajo.\n\nSe documenta y se actualiza; un resultado favorable de hace años no sustituye una revisión ante cambios."}, {"id": "m11t2", "titulo": "Señales de alerta", "tags": [["tprop", "METODOLOGÍA ACADEMIA SGI"], ["tcomp", "COMPLEMENTARIO"]], "tipo": "Buena práctica", "trazabilidad": "Metodología Academia SGI; listas de señales como buena práctica. Numerales y cambios de la edición 2025 por verificar contra el texto oficial. Contenido original de Academia SGI; no constituye asesoría legal.", "texto": "Ejemplos: intermediario recomendado por un funcionario, comisión desproporcionada, pagos a cuentas en otro país o a terceros, negativa a aceptar cláusulas antisoborno, estructura societaria opaca. Una señal no prueba un delito: obliga a investigar y a decidir con registro."}, {"id": "m11t3", "titulo": "Etapas de la debida diligencia", "tags": [["t37001", "ISO 37001:2025"], ["tprop", "METODOLOGÍA ACADEMIA SGI"]], "tipo": "Requisito / Metodología", "trazabilidad": "ISO 37001 exige debida diligencia proporcional; las etapas son metodología propia. Numerales por verificar contra el texto oficial. Contenido original de Academia SGI.", "texto": "Etapas: clasificar al tercero por riesgo; recopilar información; verificar fuentes; evaluar y decidir (aprobar, aprobar con condiciones, rechazar); aplicar medidas (cláusulas, controles de pago); y monitorear con revisión periódica.\n\nEjemplo (transporte): un agente aduanal con comisión alta se aprueba solo con pagos a cuenta local verificada y cláusula antisoborno."}], "preguntas": [{"id": "m11q1", "tipo": "mc", "nivel": "Intermedio", "texto": "La debida diligencia debe ser:", "opciones": ["Idéntica para todos los terceros", "Proporcional al riesgo", "Opcional siempre", "Solo para clientes"], "correcta": 1, "fuente": "ISO 37001", "competencia": "Debida diligencia", "remedial": "Estudiar Módulo 11, tema 1"}, {"id": "m11q2", "tipo": "vf", "nivel": "Intermedio", "texto": "Una señal de alerta demuestra que hubo soborno.", "opciones": ["Verdadero", "Falso"], "correcta": 1, "fuente": "Metodología Academia SGI", "competencia": "Debida diligencia", "remedial": "Estudiar Módulo 11, tema 2"}, {"id": "m11q3", "tipo": "mc", "nivel": "Básico", "texto": "¿Qué determina la profundidad de la debida diligencia?", "opciones": ["El nivel de riesgo", "El tamaño del logotipo", "La antigüedad", "Nada"], "correcta": 0, "fuente": "ISO 37001:2025 (por verificar)", "competencia": "Debida diligencia", "remedial": "Estudiar Módulo 11, tema 1"}, {"id": "m11q4", "tipo": "vf", "nivel": "Avanzado", "texto": "Una señal de alerta equivale a una prueba de soborno.", "opciones": ["Verdadero", "Falso"], "correcta": 1, "fuente": "ISO 37001:2025 (por verificar)", "competencia": "Debida diligencia", "remedial": "Estudiar Módulo 11, tema 2"}, {"id": "m11q5", "tipo": "mc", "nivel": "Profesional", "texto": "Un tercero pide pagos a cuenta en otro país. ¿Qué haces?", "opciones": ["Profundizar la debida diligencia y exigir justificación documentada", "Aprobar de inmediato", "Ocultar el hallazgo", "Pagar en efectivo"], "correcta": 0, "fuente": "ISO 37001:2025 (por verificar)", "competencia": "Debida diligencia", "remedial": "Estudiar Módulo 11, tema 2"}, {"id": "m11q6", "tipo": "mc", "nivel": "Profesional", "texto": "¿Qué ocurre tras aprobar a un tercero?", "opciones": ["Monitoreo y revisión periódica", "Nada", "Cancelar el expediente", "Eliminar registros"], "correcta": 0, "fuente": "ISO 37001:2025 (por verificar)", "competencia": "Debida diligencia", "remedial": "Estudiar Módulo 11, tema 3"}], "intro": "La debida diligencia convierte sospechas en decisiones informadas. Se aplica en proporción al riesgo y se documenta.", "objetivos": ["Definir cuándo y cuánto aplicar debida diligencia.", "Recorrer las etapas del proceso.", "Interpretar señales de alerta sin prejuzgar."], "competencias": ["Debida diligencia"], "casos": [{"titulo": "Caso: Logística Meridiana", "texto": "Un proveedor ficticio propone una comisión del 15 % y pagos a una cuenta offshore. Define el nivel de debida diligencia y la decisión posible."}], "ejercicios": [{"titulo": "Ejercicio", "texto": "Ordena las etapas: monitorear, clasificar, decidir, verificar.", "orientacion": "Clasificar, verificar, decidir, monitorear."}], "actividad": "Clasifica por riesgo tus diez terceros principales y define el nivel de debida diligencia.", "resumen": "La debida diligencia es proporcional al riesgo, se documenta y se actualiza. Las señales de alerta obligan a investigar, no a condenar.", "glosario": [["Debida diligencia", "Evaluación de terceros y operaciones según el riesgo."], ["Tercero", "Persona u organización externa con relación de negocio."], ["Señal de alerta", "Indicio que exige análisis."], ["Cláusula antisoborno", "Compromiso contractual de no sobornar."]], "bibliografia": ["ISO 37001:2025. Sistemas de gestión antisoborno. Requisitos con orientación para su uso.", "ISO 37301:2021. Sistemas de gestión de compliance. Requisitos con orientación.", "ISO/TS 37008 (edición vigente, por verificar). Investigaciones internas en organizaciones.", "ISO 31000:2018. Gestión del riesgo. Directrices.", "ISO 19011:2018. Directrices para la auditoría de los sistemas de gestión."]}, {"id": "m12", "titulo": "Módulo 12. Controles financieros y no financieros", "temas": [{"id": "m12t1", "titulo": "Controles financieros", "tags": [["t37001", "ISO 37001:2025"]], "tipo": "Requisito", "trazabilidad": "Fuente: ISO 37001 (controles financieros). Numerales y cambios de la edición 2025 por verificar contra el texto oficial. Contenido original de Academia SGI; no constituye asesoría legal.", "texto": "Gestionan transacciones para reducir el riesgo de soborno: segregación de funciones, doble aprobación, pagos documentados y a cuentas verificadas, conciliaciones, límites de autoridad y revisión de gastos inusuales.\n\nEjemplo (servicios financieros): quien crea un proveedor no puede aprobar sus pagos."}, {"id": "m12t2", "titulo": "Controles no financieros", "tags": [["t37001", "ISO 37001:2025"], ["tcomp", "COMPLEMENTARIO"]], "tipo": "Requisito / Buena práctica", "trazabilidad": "Fuente: ISO 37001; ejemplos concretos son buena práctica. Numerales y cambios de la edición 2025 por verificar contra el texto oficial. Contenido original de Academia SGI; no constituye asesoría legal.", "texto": "Cubren contratación, compras, comerciales y relaciones con terceros: criterios de selección, evaluación de ofertas por comité, cláusulas antisoborno en contratos, rotación en cargos expuestos y capacitación dirigida."}, {"id": "m12t3", "titulo": "Planificar los cambios en el sistema", "tags": [["t37001", "ISO 37001:2025"], ["tprop", "METODOLOGÍA ACADEMIA SGI"]], "tipo": "Requisito (edición) / Metodología", "trazabilidad": "Fuentes secundarias (organismos de certificación y firmas legales) sobre la edición 2025; contrastar con el texto oficial de ISO. La planificación de cambios tiene cláusula propia en la edición 2025 según estas fuentes. Numerales por verificar contra el texto oficial. Contenido original de Academia SGI.", "texto": "Cuando cambia el negocio (un nuevo país, un nuevo tipo de tercero, una fusión), los riesgos y controles cambian. La edición 2025 pide planificar los cambios del sistema: propósito, consecuencias, recursos y responsabilidades.\n\nEjemplo (comercio): al abrir ventas en un mercado nuevo, se actualiza la evaluación de riesgos, se capacita al equipo local y se ajustan límites de pago."}], "preguntas": [{"id": "m12q1", "tipo": "mc", "nivel": "Intermedio", "texto": "¿Cuál es un control financiero antisoborno?", "opciones"
